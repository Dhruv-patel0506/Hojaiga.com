<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hojaiga OS — True Runtime Visualizer (v2)</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --grid-color: #2c2c2c;
            --text-color: #e0e0e0;
            --node-bg: #2d2d2d;
            --node-border: #444;
            --node-title-bg: #3c3c3c;
            
            /* State Colors */
            --state-inactive: #444;
            --state-ready: #ffc107;
            --state-running: #007bff;
            --state-success: #28a745;
            --state-error: #dc3545;
            
            --conn-color: #555;
            --panel-bg: rgba(30, 30, 30, 0.95);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        #toolbar {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: var(--panel-bg);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--node-border);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button {
            background: var(--node-title-bg);
            color: white;
            border: 1px solid var(--node-border);
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }

        button:hover {
            background: #555;
        }

        button.active {
            background: var(--state-running);
            border-color: var(--state-running);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }

        #canvas {
            transform-origin: 0 0;
            width: 100%;
            height: 100%;
        }

        .node {
            position: absolute;
            width: 260px;
            background: var(--node-bg);
            border: 2px solid var(--node-border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            opacity: 0.5; /* Inactive by default */
        }

        /* Node States */
        .node.INACTIVE { border-color: var(--state-inactive); opacity: 0.5; }
        .node.READY { border-color: var(--state-ready); opacity: 1; box-shadow: 0 0 10px rgba(255, 193, 7, 0.2); }
        .node.RUNNING { border-color: var(--state-running); opacity: 1; box-shadow: 0 0 15px rgba(0, 123, 255, 0.4); transform: scale(1.02); }
        .node.SUCCESS { border-color: var(--state-success); opacity: 1; }
        .node.ERROR { border-color: var(--state-error); opacity: 1; box-shadow: 0 0 15px rgba(220, 53, 69, 0.4); }

        .node-header {
            background: var(--node-title-bg);
            padding: 8px 12px;
            border-radius: 6px 6px 0 0;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--node-border);
        }

        .node-title {
            font-weight: 600;
            font-size: 13px;
            flex-grow: 1;
        }

        .node-status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--state-inactive);
            transition: background 0.3s;
        }

        .INACTIVE .node-status-indicator { background: var(--state-inactive); }
        .READY .node-status-indicator { background: var(--state-ready); }
        .RUNNING .node-status-indicator { background: var(--state-running); }
        .SUCCESS .node-status-indicator { background: var(--state-success); }
        .ERROR .node-status-indicator { background: var(--state-error); }

        .node-body {
            padding: 10px 12px;
            font-size: 11px;
            color: #aaa;
            line-height: 1.4;
        }
        
        .node-id {
            color: #666;
            font-family: monospace;
            font-size: 10px;
            margin-bottom: 4px;
        }

        svg.connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .edge {
            fill: none;
            stroke: var(--conn-color);
            stroke-width: 2;
            stroke-dasharray: 4 4;
            opacity: 0.3;
            transition: all 0.3s;
        }

        .edge.ACTIVE {
            stroke: var(--state-running);
            stroke-dasharray: none;
            stroke-width: 3;
            opacity: 1;
        }
        
        .edge.COMPLETED {
            stroke: var(--state-success);
            stroke-dasharray: none;
            opacity: 0.8;
        }
        
        .edge.FAILED {
            stroke: var(--state-error);
            stroke-dasharray: none;
            opacity: 1;
        }

        .motion-dot {
            fill: #fff;
            r: 5;
            filter: drop-shadow(0 0 6px #fff);
        }

        #trace-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 400px;
            background: var(--panel-bg);
            border: 1px solid var(--node-border);
            border-radius: 8px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            z-index: 100;
        }

        .trace-event {
            font-family: monospace;
            font-size: 12px;
            padding: 6px 0;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        
        .trace-time {
            color: #888;
        }
        
        .trace-name {
            color: var(--text-color);
            font-weight: bold;
        }
        
        .trace-organ {
            color: var(--state-running);
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <strong>Hojaiga True Runtime</strong>
        <button id="btn-demo-success">Simulate Success Flow</button>
        <button id="btn-demo-error">Simulate Recovery Flow</button>
        <button id="btn-reset">Reset</button>
    </div>

    <div id="canvas-container">
        <div id="canvas">
            <svg class="connections" id="edges-svg"></svg>
            <div id="nodes-container"></div>
        </div>
    </div>

    <div id="trace-panel">
        <div style="font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 8px;">Live Event Trace</div>
        <div id="trace-content">
            <div style="color: #666; font-style: italic;">Awaiting events...</div>
        </div>
    </div>

    <script>
        const nodesData = [
            { id: "interface", x: 100, y: 150, name: "11 Interface / UI", desc: "User input ingestion" },
            { id: "sysboot", x: 100, y: 280, name: "System Boot", desc: "Composition Root" },
            
            { id: "cns", x: 400, y: 280, name: "02 CNS", desc: "Message Routing" },
            
            { id: "brain", x: 700, y: 150, name: "01 Brain", desc: "Intent analysis" },
            { id: "memory", x: 1000, y: 50, name: "03 Memory", desc: "Context retrieval" },
            { id: "knowledge", x: 1000, y: 150, name: "04 Knowledge", desc: "Domain rules" },
            { id: "llm", x: 1000, y: 250, name: "37 LLM Gateway", desc: "Reasoning engine" },
            
            { id: "compiler", x: 700, y: 400, name: "36 Workflow Compiler", desc: "Builds execution DAG" },
            { id: "decision", x: 700, y: 530, name: "22 Decision Engine", desc: "Validates actions" },
            
            { id: "security", x: 1000, y: 430, name: "Security / Gov", desc: "Checks constraints" },
            { id: "capability", x: 1000, y: 530, name: "Capability Registry", desc: "Validates tools" },
            
            { id: "orchestrator", x: 700, y: 680, name: "38 Task Orchestrator", desc: "Schedules DAG execution" },
            
            { id: "agent_a", x: 1000, y: 680, name: "Agent A", desc: "Active Worker" },
            
            { id: "perception", x: 1300, y: 600, name: "31 Visual Perception", desc: "Reads screen state" },
            { id: "controller", x: 1300, y: 700, name: "05 Controllers", desc: "Dispatches physical actions" },
            { id: "cdp", x: 1600, y: 700, name: "19 Chrome CDP", desc: "Browser automation" },
            
            { id: "checkpoint", x: 1300, y: 820, name: "Checkpoint / Verify", desc: "Validates outcome" },
            
            { id: "done", x: 1600, y: 820, name: "Completion", desc: "SUCCESS" },
            { id: "error", x: 1000, y: 820, name: "25 Error Catalog", desc: "Classifies failure" },
            { id: "replanner", x: 700, y: 820, name: "Replanner", desc: "Generates recovery plan" }
        ];

        const edgesData = [
            { source: "interface", target: "sysboot" },
            { source: "sysboot", target: "cns" },
            { source: "cns", target: "brain" },
            
            { source: "brain", target: "memory" },
            { source: "brain", target: "knowledge" },
            { source: "brain", target: "llm" },
            
            { source: "brain", target: "compiler" },
            { source: "compiler", target: "decision" },
            
            { source: "decision", target: "security" },
            { source: "decision", target: "capability" },
            
            { source: "decision", target: "orchestrator" },
            
            { source: "orchestrator", target: "agent_a" },
            { source: "agent_a", target: "perception" },
            { source: "agent_a", target: "controller" },
            { source: "controller", target: "cdp" },
            
            { source: "cdp", target: "checkpoint" },
            
            // Branching
            { source: "checkpoint", target: "done" },
            { source: "checkpoint", target: "error" },
            
            // Recovery loop
            { source: "error", target: "replanner" },
            { source: "replanner", target: "cns" }
        ];

        const container = document.getElementById("nodes-container");
        const svg = document.getElementById("edges-svg");
        const traceEl = document.getElementById("trace-content");

        // Pan/Zoom
        let transform = { x: 0, y: -50, scale: 0.8 };
        let isDragging = false, startPos = {x:0, y:0};
        
        document.getElementById('canvas-container').onmousedown = e => {
            isDragging = true;
            startPos = { x: e.clientX - transform.x, y: e.clientY - transform.y };
        };
        window.onmousemove = e => {
            if(!isDragging) return;
            transform.x = e.clientX - startPos.x;
            transform.y = e.clientY - startPos.y;
            updateTransform();
        };
        window.onmouseup = () => isDragging = false;
        document.getElementById('canvas-container').onwheel = e => {
            transform.scale += e.deltaY * -0.001;
            updateTransform();
        };

        function updateTransform() {
            document.getElementById('canvas').style.transform = `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})`;
        }

        // Render Nodes
        nodesData.forEach(n => {
            const el = document.createElement("div");
            el.className = `node INACTIVE`;
            el.id = `node-${n.id}`;
            el.style.left = `${n.x}px`;
            el.style.top = `${n.y}px`;
            el.innerHTML = `
                <div class="node-header">
                    <div class="node-status-indicator"></div>
                    <div class="node-title">${n.name}</div>
                </div>
                <div class="node-body">
                    <div class="node-id">[ID: ${n.id}]</div>
                    ${n.desc}
                </div>
            `;
            container.appendChild(el);
        });

        // Render Edges
        function drawEdges() {
            svg.innerHTML = '';
            edgesData.forEach(e => {
                const src = document.getElementById(`node-${e.source}`);
                const tgt = document.getElementById(`node-${e.target}`);
                
                const sRect = { x: parseInt(src.style.left) + 260, y: parseInt(src.style.top) + 40 };
                const tRect = { x: parseInt(tgt.style.left), y: parseInt(tgt.style.top) + 40 };
                
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", `M ${sRect.x} ${sRect.y} C ${sRect.x + 100} ${sRect.y}, ${tRect.x - 100} ${tRect.y}, ${tRect.x} ${tRect.y}`);
                path.setAttribute("id", `edge-${e.source}-${e.target}`);
                path.setAttribute("class", "edge");
                svg.appendChild(path);
            });
        }

        // State Management
        function setNodeState(nodeId, state) {
            const el = document.getElementById(`node-${nodeId}`);
            if(el) {
                el.className = `node ${state}`;
            }
        }

        function setEdgeState(src, tgt, state) {
            const el = document.getElementById(`edge-${src}-${tgt}`);
            if(el) {
                el.setAttribute("class", `edge ${state}`);
            }
        }

        function logTrace(event_name, organ, time) {
            const d = document.createElement('div');
            d.className = 'trace-event';
            d.innerHTML = `<span class="trace-time">[${time}]</span> <span class="trace-name">${event_name}</span> <span class="trace-organ">@${organ}</span>`;
            traceEl.prepend(d);
        }

        // Live Simulation Runner
        async function runSimulation(sequence) {
            // Reset
            nodesData.forEach(n => setNodeState(n.id, 'INACTIVE'));
            drawEdges();
            traceEl.innerHTML = '';

            let time = 100;
            for(let step of sequence) {
                time += Math.floor(Math.random() * 50);
                
                // Set node to running
                if (step.node) setNodeState(step.node, 'RUNNING');
                
                // Activate edges
                if (step.from) {
                    step.from.forEach(f => setEdgeState(f, step.node, 'ACTIVE'));
                }

                // Log event
                logTrace(step.event, step.node, `T+${time}ms`);

                await new Promise(r => setTimeout(r, 800));

                // Mark successful
                if (step.node) setNodeState(step.node, step.status || 'SUCCESS');
                
                if (step.from) {
                    step.from.forEach(f => setEdgeState(f, step.node, 'COMPLETED'));
                }
            }
        }

        // Simulation Sequences
        const successSequence = [
            { node: "interface", event: "USER_INPUT_RECEIVED" },
            { node: "sysboot", from: ["interface"], event: "BOOTSTRAP_ROUTING" },
            { node: "cns", from: ["sysboot"], event: "TASK_RECEIVED" },
            { node: "brain", from: ["cns"], event: "BRAIN_ANALYSIS_STARTED" },
            
            // Parallel memory / knowledge
            { node: "memory", from: ["brain"], event: "MEMORY_CONTEXT_REQUESTED" },
            { node: "knowledge", from: ["brain"], event: "KNOWLEDGE_CONTEXT_REQUESTED" },
            { node: "llm", from: ["brain"], event: "LLM_REASONING_STARTED" },
            
            { node: "compiler", from: ["brain"], event: "TASK_COMPILE_REQUESTED" },
            { node: "decision", from: ["compiler"], event: "WORKFLOW_COMPILED" },
            
            { node: "security", from: ["decision"], event: "SECURITY_CHECK" },
            { node: "capability", from: ["decision"], event: "CAPABILITY_CHECK" },
            
            { node: "orchestrator", from: ["decision"], event: "ORCHESTRATION_STARTED" },
            { node: "agent_a", from: ["orchestrator"], event: "AGENTS_ASSIGNED" },
            
            // Parallel action and perception
            { node: "perception", from: ["agent_a"], event: "PERCEPTION_REQUESTED" },
            { node: "controller", from: ["agent_a"], event: "ACTION_REQUESTED" },
            { node: "cdp", from: ["controller"], event: "BROWSER_AUTOMATION_STARTED" },
            
            { node: "checkpoint", from: ["cdp"], event: "CHECKPOINT_CREATED" },
            { node: "done", from: ["checkpoint"], event: "CHECKPOINT_VERIFIED_SUCCESS" }
        ];

        const errorSequence = [
            ...successSequence.slice(0, 16), // Run up to CDP
            { node: "checkpoint", from: ["cdp"], event: "CHECKPOINT_CREATED" },
            { node: "error", from: ["checkpoint"], event: "ACTION_FAILED", status: "ERROR" },
            { node: "replanner", from: ["error"], event: "RECOVERY_DECISION" },
            { node: "cns", from: ["replanner"], event: "REPLAN_SUBMITTED" }
        ];

        document.getElementById('btn-demo-success').onclick = () => runSimulation(successSequence);
        document.getElementById('btn-demo-error').onclick = () => runSimulation(errorSequence);
        document.getElementById('btn-reset').onclick = () => {
            nodesData.forEach(n => setNodeState(n.id, 'INACTIVE'));
            drawEdges();
            traceEl.innerHTML = '<div style="color: #666; font-style: italic;">Awaiting events...</div>';
        };

        // Init
        drawEdges();
        updateTransform();
    </script>
</body>
</html>
