      const scale = Math.max(0.55, Math.min(1.6, cmd.scale || 1));

      // -----------------------------------------------------------------------
      // CAMERA MODE 1: 1ST-PERSON POV (through the actor's eyes)
      // -----------------------------------------------------------------------
      if (pov.includes('1st') || pov.includes('fpv') || pov.includes('first')) {
        const cx = cmd.cx || 285;
        const cy = cmd.cy || 295;
        const w = 390, h = 280;
        const speed = action.includes('sprint') ? 5.8 : action.includes('run') ? 4.0 : 2.4;
        const bobX = Math.sin(tSec * speed * Math.PI) * 12;
        const bobY = Math.abs(Math.cos(tSec * speed * Math.PI)) * 10;

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(cx - w / 2, cy - h / 2, w, h, 14);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.4;
        ctx.stroke();
        ctx.clip();

        const horizonY = cy - 25 + bobY;

        ctx.strokeStyle = 'rgba(56, 189, 248, 0.42)';
        ctx.lineWidth = 1.6;
        for (let i = -6; i <= 6; i++) {
          ctx.beginPath();
          ctx.moveTo(cx + bobX + i * 12, horizonY);
          ctx.lineTo(cx + bobX + i * 95, cy + h / 2);
          ctx.stroke();
        }
        const flowOffset = (tSec * speed * 0.6) % 1;
        for (let d = 0; d < 7; d++) {
          const zNorm = ((d + flowOffset) / 7);
          const gy = horizonY + Math.pow(zNorm, 1.8) * (h / 2 + 25);
          ctx.beginPath();
          ctx.moveTo(cx - w / 2, gy);
          ctx.lineTo(cx + w / 2, gy);
          ctx.stroke();
        }

        const swing = Math.sin(tSec * speed * Math.PI * 2);
        const lHandX = cx - 95 + swing * 22 + bobX * 0.5;
        const lHandY = cy + 70 - Math.max(0, swing) * 55 + bobY;
        const rHandX = cx + 95 - swing * 22 + bobX * 0.5;
        const rHandY = cy + 70 - Math.max(0, -swing) * 55 + bobY;

        drawTaperedLimb(ctx, { x: cx - 165, y: cy + 155 }, { x: lHandX, y: lHandY }, 18, 12, color, 0.45);
        drawTaperedLimb(ctx, { x: cx + 165, y: cy + 155 }, { x: rHandX, y: rHandY }, 18, 12, color, 0.45);

        ctx.fillStyle = '#f8fafc';
        ctx.font = '700 12.5px "Segoe UI", sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(`1ST-PERSON POV - ${action.toUpperCase()}`, cx - w / 2 + 16, cy - h / 2 + 24);
        ctx.restore();
        return;
      }

      // -----------------------------------------------------------------------
      // CAMERA MODES 2 & 3: 2ND-PERSON (face-to-face) & 3RD-PERSON (side/iso)
      // -----------------------------------------------------------------------
      const is2ndPOV = pov.includes('2nd') || pov.includes('front') || pov.includes('face');
      const yaw = is2ndPOV ? (Math.sin(tSec * 1.2) * 0.18) : (cmd.yaw ?? 1.38);
      const pitch = is2ndPOV ? 0.08 : (cmd.pitch ?? 0.15);

      const x1 = cmd.x1 || 120;
      const x2 = cmd.x2 || 440;
      const baseY = cmd.y1 || 320;

      const isLocomotion = /\b(walk|run|sprint|jog|swim|dive|move)\b/i.test(action) && !is2ndPOV;
      const travelPhase = (tSec % 3.6) / 3.6;
      const curX = isLocomotion ? (x1 + (x2 - x1) * travelPhase) : (cmd.cx || 275);
      const curY = baseY;

      ctx.save();
      if (action.includes('dive') || action.includes('swim') || action.includes('pool')) {
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(75, baseY + 82);
        ctx.lineTo(195, baseY + 82);
        ctx.lineTo(195, baseY + 135);
        ctx.stroke();

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.beginPath();
        for (let wx = 195; wx <= 485; wx += 8) {
          const wy = baseY + 98 + Math.sin((wx * 0.06) - tSec * 5) * 6;
          if (wx === 195) ctx.moveTo(wx, wy);
          else ctx.lineTo(wx, wy);
        }
        ctx.stroke();
      } else {
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.55)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(85, baseY + 84);
        ctx.lineTo(475, baseY + 84);
        ctx.stroke();
      }
      ctx.restore();

      const rig = computeDynamicRigJoints(action, tSec, cmd.params || {});

      const proj = {};
      for (const key of Object.keys(rig)) {
        if (typeof rig[key] === 'object' && rig[key] !== null && 'x' in rig[key]) {
          proj[key] = project3DPoint(
            rig[key].z,
            -rig[key].y,
            rig[key].x,
            curX,
            curY,
            scale,
            pitch,
            yaw
          );
        }
      }
      // Bail out cleanly if projection produced anything unusable.
      for (const k of ['head', 'chest', 'pelvis', 'lFoot', 'rFoot', 'lHand', 'rHand']) {
        if (!proj[k] || !Number.isFinite(proj[k].x) || !Number.isFinite(proj[k].y)) return;
      }

      const backColor = 'rgba(56, 189, 248, 0.62)';
      drawTaperedLimb(ctx, proj.lHip, proj.lKnee, 7 * scale, 5.5 * scale, backColor, 0.2);
      drawTaperedLimb(ctx, proj.lKnee, proj.lFoot, 5.5 * scale, 4 * scale, backColor, 0.2);
      drawTaperedLimb(ctx, proj.lShoulder, proj.lElbow, 6 * scale, 4.5 * scale, backColor, 0.2);
      drawTaperedLimb(ctx, proj.lElbow, proj.lHand, 4.5 * scale, 3.5 * scale, backColor, 0.2);

      drawTaperedLimb(ctx, proj.chest, proj.pelvis, 13 * scale, 10 * scale, color, 0.32);

      ctx.save();
      ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.8;
      ctx.beginPath();
      ctx.arc(proj.head.x, proj.head.y, 15 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#facc15';
      if (is2ndPOV) {
        ctx.beginPath();
        ctx.arc(proj.head.x - 5 * scale, proj.head.y - 2 * scale, 2.5 * scale, 0, Math.PI * 2);
        ctx.arc(proj.head.x + 5 * scale, proj.head.y - 2 * scale, 2.5 * scale, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(proj.head.x + 8 * scale, proj.head.y - 2 * scale, 3 * scale, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      drawTaperedLimb(ctx, proj.rHip, proj.rKnee, 7.5 * scale, 5.5 * scale, color, 0.35);
      drawTaperedLimb(ctx, proj.rKnee, proj.rFoot, 5.5 * scale, 4 * scale, color, 0.35);
      drawTaperedLimb(ctx, proj.rShoulder, proj.rElbow, 6.5 * scale, 5 * scale, color, 0.35);
      drawTaperedLimb(ctx, proj.rElbow, proj.rHand, 5 * scale, 3.8 * scale, color, 0.35);

      ctx.save();
      ctx.fillStyle = '#f8fafc';
      [proj.chest, proj.pelvis, proj.rKnee, proj.lKnee, proj.rElbow, proj.lElbow].forEach(pt => {
        if (!pt) return;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 3 * scale, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();

      if (cmd.showProtractor) {
        drawJointProtractor(proj.rHip, proj.rKnee, proj.rFoot, 'knee');
        drawJointProtractor(proj.pelvis, proj.chest, proj.rShoulder, 'torso');
        ctx.save();
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = 'rgba(250, 204, 21, 0.55)';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(proj.pelvis.x, proj.pelvis.y + 55);
        ctx.lineTo(proj.pelvis.x, proj.pelvis.y - 70);
        ctx.stroke();
        ctx.restore();
      }
    }

    // =========================================================================
    // 5e. DYNAMIC KEYFRAME SEQUENCER - LLM invents any animation on the fly
    // [KEYFRAMES:shape:t0,x0,y0,rot0,scale0->t1,x1,y1,rot1,scale1:label:color]
    // =========================================================================
    function kfDrawShape(shape, color) {
      ctx.fillStyle = color;
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      if (shape === 'box' || shape === 'rect') {
        ctx.beginPath();
        ctx.roundRect(-24, -18, 48, 36, 6);
        ctx.fill();
      } else if (shape === 'arrow') {
        ctx.beginPath();
        ctx.moveTo(-26, -10);
        ctx.lineTo(8, -10);
        ctx.lineTo(8, -20);
        ctx.lineTo(28, 0);
        ctx.lineTo(8, 20);
        ctx.lineTo(8, 10);
        ctx.lineTo(-26, 10);
        ctx.closePath();
        ctx.fill();
      } else if (shape === 'triangle') {
        ctx.beginPath();
        ctx.moveTo(0, -24);
        ctx.lineTo(22, 18);
        ctx.lineTo(-22, 18);
        ctx.closePath();
        ctx.fill();
      } else if (shape === 'actor') {
        ctx.beginPath();
        ctx.arc(0, -22, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 3.4;
        ctx.beginPath();
        ctx.moveTo(0, -14);
        ctx.lineTo(0, 10);
        ctx.moveTo(-14, -6);
        ctx.lineTo(14, -6);
        ctx.moveTo(0, 10);
        ctx.lineTo(-11, 26);
        ctx.moveTo(0, 10);
        ctx.lineTo(11, 26);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, 20, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function renderKeyframesCommand(cmd, elapsed, color) {
      const frames = cmd.keyframes || [];
      if (frames.length < 2) return;
      const last = frames[frames.length - 1];
      const inSeconds = last.t > 1;
      const span = Math.max(0.001, inSeconds ? last.t : 1);
      const loopMs = Math.max(600, (inSeconds ? last.t : 3) * 1000);
      const tt = ((elapsed % loopMs) / loopMs) * span;

      ctx.save();
      ctx.globalAlpha = 0.3;
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      frames.forEach((f, i) => (i === 0 ? ctx.moveTo(f.x, f.y) : ctx.lineTo(f.x, f.y)));
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
      ctx.restore();

      let i = 0;
      while (i < frames.length - 2 && frames[i + 1].t <= tt) i++;
      const a = frames[i];
      const b = frames[i + 1];
      const u = b.t === a.t ? 0 : Math.max(0, Math.min(1, (tt - a.t) / (b.t - a.t)));
      const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      const x = a.x + (b.x - a.x) * e;
      const y = a.y + (b.y - a.y) * e;
      const rot = ((a.rot + (b.rot - a.rot) * e) * Math.PI) / 180;
      const sc = Math.max(0.1, a.scale + (b.scale - a.scale) * e);

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.scale(sc, sc);
      kfDrawShape((cmd.shape || 'circle').toLowerCase(), color);
      ctx.restore();
    }

    // =========================================================================
    // 5f. AUTO-LAYOUT FLOWCHART / MIND-MAP / SYSTEM GRAPH
    // [GRAPH:From->To|From->To:label:color] - nodes laid out automatically,
    // directed edges flow with animated dashes + travelling pulses.
    // =========================================================================
    function renderGraphCommand(cmd, elapsed, color) {
      const nodes = cmd.nodes || [];
      const pos = cmd.nodePositions || {};
      const boxW = 116;
      const boxH = 42;

      for (const e of cmd.edges || []) {
        const a = pos[e.from];
        const b = pos[e.to];
        if (!a || !b) continue;
        ctx.save();
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.75)';
        ctx.lineWidth = 2.4;
        ctx.setLineDash([9, 7]);
        ctx.lineDashOffset = -(elapsed / 45);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        ctx.setLineDash([]);

        const t = (elapsed % 1600) / 1600;
        const px = a.x + (b.x - a.x) * t;
        const py = a.y + (b.y - a.y) * t;
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(px, py, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      nodes.forEach((name, idx) => {
        const key = (name && typeof name === 'object')
          ? String(name.id ?? name.label ?? idx)
          : String(name);
        const p = pos[key];
        if (!p) return;
        const appear = Math.min(1, Math.max(0, (elapsed - idx * 160) / 380));
        if (appear <= 0) return;
        const s = 0.7 + 0.3 * (1 - Math.pow(1 - appear, 3));
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.scale(s, s);
        ctx.globalAlpha = appear;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.roundRect(-boxW / 2, -boxH / 2, boxW, boxH, 10);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#f8fafc';
        let text = (name && typeof name === 'object')
          ? String(name.label ?? name.id ?? key)
          : String(name);
        ctx.font = '700 12.5px "Segoe UI", sans-serif';
        while (text.length > 3 && ctx.measureText(text).width > boxW - 14) text = text.slice(0, -1);
        ctx.fillText(text, 0, 0);
        ctx.restore();
      });
      ctx.restore();
    }

    // =========================================================================
    // 5g. LIVE CODE / MEMORY / ALGORITHM STEP-TRACER
    // [TRACE:v1,v2,...:swap=i,j:ptr=k:label:color] - array cells, swapping
    // pairs animate across each other, pointer arrow bobs below an index.
    // =========================================================================
    function renderTraceCommand(cmd, elapsed, color) {
      const vals = cmd.values || [];
      const n = vals.length;
      if (!n) return;
      const W = (cmd._traceRect && cmd._traceRect.w) || 430;
      const H = (cmd._traceRect && cmd._traceRect.h) || 240;
      const gap = 8;
      const cellW = Math.min(70, (W - gap * (n + 1)) / n);
      const cellH = cellW * 1.15;
      const totalW = n * cellW + (n - 1) * gap;
      const x0 = (W - totalW) / 2;
      const baseY = H * 0.4;

      let swapOff = 0;
      const swap = cmd.swapIndices || [];
      if (swap.length === 2) {
        const ph = (elapsed % 2400) / 2400;
        const u = ph < 0.42 ? ph / 0.42 : ph < 0.5 ? 1 : ph < 0.92 ? 1 - (ph - 0.5) / 0.42 : 0;
        swapOff = (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2) * (cellW + gap);
      }

      for (let i = 0; i < n; i++) {
        const isSwap = swap.includes(i);
        let cx = x0 + i * (cellW + gap) + cellW / 2;
        if (isSwap) cx += swap[0] === i ? swapOff : -swapOff;
        const pulse = isSwap ? 0.5 + 0.5 * Math.abs(Math.sin(elapsed / 140)) : 0;
        const y = baseY;
        ctx.save();
        ctx.fillStyle = `rgba(15, 23, 42, ${0.92 + pulse * 0.05})`;
        ctx.strokeStyle = isSwap ? '#f87171' : color;
        ctx.lineWidth = isSwap ? 3 + pulse * 1.6 : 2.2;
        ctx.shadowColor = isSwap ? 'rgba(248, 113, 113, 0.8)' : 'transparent';
        ctx.shadowBlur = isSwap ? 8 + pulse * 8 : 0;
        ctx.beginPath();
        ctx.roundRect(cx - cellW / 2, y, cellW, cellH, 8);
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#f8fafc';
        ctx.font = `700 ${Math.max(13, Math.min(19, cellW * 0.36))}px "Consolas", monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(vals[i]), cx, y + cellH / 2);
        if (i === (cmd.pointerIndex || 0)) {
          const bob = Math.sin(elapsed / 180) * 4;
          ctx.fillStyle = '#facc15';
          ctx.beginPath();
          ctx.moveTo(cx, y + cellH + 8 + bob);
          ctx.lineTo(cx - 9, y + cellH + 24 + bob);
          ctx.lineTo(cx + 9, y + cellH + 24 + bob);
          ctx.closePath();
          ctx.fill();
          ctx.font = '700 11px "Segoe UI", sans-serif';
          ctx.fillText('ptr', cx, y + cellH + 36 + bob);
        }
        ctx.restore();
      }
    }

    // =========================================================================
    // 5h. PARTICLE / VECTOR-FIELD / FLUID SIMULATOR
    // [FIELD:gas|electric|magnetic|fluid:intensity:label:color]
    // =========================================================================
    function renderFieldCommand(cmd, elapsed, color) {
      const W = (cmd._fieldRect && cmd._fieldRect.w) || 390;
      const H = (cmd._fieldRect && cmd._fieldRect.h) || 290;
      const kind = (cmd.fieldType || 'gas').toLowerCase();
      const intensity = Math.max(10, Math.min(200, cmd.intensity || 60));
      const speed = intensity / 60;

      if (kind === 'gas') {
        if (!cmd._fp) {
          cmd._fp = [];
          for (let i = 0; i < 30; i++) {
            const ang = Math.random() * Math.PI * 2;
            const v = 40 + Math.random() * 70;
            cmd._fp.push({
              x: Math.random() * W,
              y: Math.random() * H,
              px: 0,
              py: 0,
              vx: Math.cos(ang) * v,
              vy: Math.sin(ang) * v,
            });
          }
        }
        const dt = 1 / 60;
        ctx.save();
        for (const p of cmd._fp) {
          p.px = p.x;
          p.py = p.y;
          p.x += p.vx * dt * speed;
          p.y += p.vy * dt * speed;
          if (p.x < 4) { p.x = 4; p.vx *= -1; }
          if (p.x > W - 4) { p.x = W - 4; p.vx *= -1; }
          if (p.y < 4) { p.y = 4; p.vy *= -1; }
          if (p.y > H - 4) { p.y = H - 4; p.vy *= -1; }
          ctx.strokeStyle = 'rgba(251, 191, 36, 0.5)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(p.px, p.py);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
          ctx.fillStyle = '#fbbf24';
          ctx.beginPath();
          ctx.arc(p.x, p.y, 3.4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      } else if (kind === 'electric') {
        const ax = W * 0.28;
        const bx = W * 0.72;
        const cy = H / 2;
        ctx.save();
        ctx.strokeStyle = 'rgba(96, 165, 250, 0.75)';
        ctx.lineWidth = 2;
        for (let k = -2; k <= 2; k++) {
          const off = k * H * 0.16;
          ctx.setLineDash([8, 6]);
          ctx.lineDashOffset = -(elapsed / 35);
          ctx.beginPath();
          ctx.moveTo(ax, cy + off * 0.3);
          ctx.bezierCurveTo(W * 0.45, cy + off, W * 0.55, cy + off, bx, cy + off * 0.3);
          ctx.stroke();
          const t = ((elapsed / 2200) + (k + 2) / 5) % 1;
          const bez = (p0, p1, p2, p3, u) =>
            Math.pow(1 - u, 3) * p0 + 3 * Math.pow(1 - u, 2) * u * p1 + 3 * (1 - u) * u * u * p2 + u * u * u * p3;
          const px = bez(ax, W * 0.45, W * 0.55, bx, t);
          const py = bez(cy + off * 0.3, cy + off, cy + off, cy + off * 0.3, t);
          ctx.setLineDash([]);
          ctx.fillStyle = '#93c5fd';
          ctx.beginPath();
          ctx.arc(px, py, 4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.setLineDash([]);
        const drawCharge = (x, sign, col) => {
          ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
          ctx.strokeStyle = col;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(x, cy, 20, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = col;
          ctx.font = '800 24px "Segoe UI", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(sign, x, cy);
        };
        drawCharge(ax, '+', '#f87171');
        drawCharge(bx, '−', '#60a5fa');
        ctx.restore();
      } else if (kind === 'magnetic') {
        const cx = W / 2;
        const cy = H / 2;
        ctx.save();
        ctx.strokeStyle = 'rgba(167, 139, 250, 0.8)';
        ctx.lineWidth = 2.2;
        ctx.setLineDash([9, 7]);
        ctx.lineDashOffset = -(elapsed / 40);
        for (let r = 1; r <= 4; r++) {
          const rr = r * H * 0.11;
          ctx.beginPath();
          ctx.ellipse(cx, cy, rr * 0.85, rr, 0, Math.PI * 0.5, Math.PI * 1.5);
          ctx.stroke();
          ctx.beginPath();
          ctx.ellipse(cx, cy, rr * 0.85, rr, 0, Math.PI * 1.5, Math.PI * 0.5);
          ctx.stroke();
        }
        ctx.setLineDash([]);
        ctx.fillStyle = '#f87171';
        ctx.beginPath();
        ctx.arc(cx, cy - 22, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#60a5fa';
        ctx.beginPath();
        ctx.arc(cx, cy + 22, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#0f172a';
        ctx.font = '800 15px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('N', cx, cy - 22);
        ctx.fillText('S', cx, cy + 22);
        ctx.restore();
      } else {
        // fluid: laminar streamlines with flowing tracer dots
        ctx.save();
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.55)';
        ctx.lineWidth = 2;
        for (let s = 0; s < 6; s++) {
          const baseY = H * (0.16 + s * 0.136);
          ctx.beginPath();
          for (let x = 0; x <= W; x += 10) {
            const y = baseY + Math.sin((x / W) * Math.PI * 2 + elapsed / 420 + s) * 10;
            x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
          }
          ctx.stroke();
          const t = ((elapsed / 2000) * speed + s / 6) % 1;
          const dx = t * W;
          const dy = baseY + Math.sin((dx / W) * Math.PI * 2 + elapsed / 420 + s) * 10;
          ctx.fillStyle = '#7dd3fc';
          ctx.beginPath();
          ctx.arc(dx, dy, 5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    // =========================================================================
    // 5i. MOOD / ENVIRONMENT WEBAUDIO DJ + 60 FPS SPECTRUM VISUALIZER
    // Real-time procedural beat (kick + sub-bass + chord pad + hi-hat) and a
    // spectrum/equalizer display. Audio stops automatically when cleared.
    // =========================================================================
    const DJAudio = {
      ctx: null,
      master: null,
      timer: null,
      nextTime: 0,
      step: 0,
      genre: null,
      bpm: 0,
      root: 0,
      ensure(genre, bpm, root) {
        if (this.timer && this.genre === genre && this.bpm === bpm && this.root === root) return;
        this.stop();
        this.genre = genre;
        this.bpm = bpm;
        this.root = root;
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          if (!this.ctx) this.ctx = new AC();
          if (this.ctx.state === 'suspended') this.ctx.resume();
          this.master = this.ctx.createGain();
          this.master.gain.value = 0.28;
          this.master.connect(this.ctx.destination);
          this.nextTime = this.ctx.currentTime + 0.12;
          this.step = 0;
          this.timer = setInterval(() => this.tick(), 30);
        } catch (err) {
          this.timer = null;
        }
      },
      stop() {
        if (this.timer) {
          clearInterval(this.timer);
          this.timer = null;
        }
        if (this.master) {
          try {
            this.master.gain.setTargetAtTime(0, this.ctx.currentTime, 0.05);
            const m = this.master;
            setTimeout(() => { try { m.disconnect(); } catch (e) {} }, 400);
          } catch (e) {}
          this.master = null;
        }
        this.genre = null;
      },
      tick() {
        if (!this.ctx || !this.master) return;
        const stepDur = 60 / this.bpm / 2;
        while (this.nextTime < this.ctx.currentTime + 0.15) {
          this.playStep(this.step, this.nextTime, stepDur);
          this.step = (this.step + 1) % 16;
          this.nextTime += stepDur;
        }
      },
      env(node, t, dur, peak) {
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(peak, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        node.connect(g);
        g.connect(this.master);
        return g;
      },
      kick(t) {
        const o = this.ctx.createOscillator();
        o.type = 'sine';
        o.frequency.setValueAtTime(130, t);
        o.frequency.exponentialRampToValueAtTime(42, t + 0.11);
        this.env(o, t, 0.2, 0.9);
        o.start(t);
        o.stop(t + 0.25);
      },
      hat(t) {
        const len = Math.floor(this.ctx.sampleRate * 0.05);
        const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const src = this.ctx.createBufferSource();
        src.buffer = buf;
        const hp = this.ctx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 7000;
        src.connect(hp);
        this.env(hp, t, 0.05, 0.22);
        src.start(t);
        src.stop(t + 0.06);
      },
      bass(t, freq, dur) {
        const o = this.ctx.createOscillator();
        o.type = this.genre === 'synthwave' ? 'sawtooth' : 'triangle';
        o.frequency.value = freq;
        this.env(o, t, dur, 0.4);
        o.start(t);
        o.stop(t + dur + 0.05);
      },
      pad(t, freqs, dur) {
        freqs.forEach((f) => {
          const o = this.ctx.createOscillator();
          o.type = this.genre === 'hype' ? 'square' : 'sine';
          o.frequency.value = f;
          this.env(o, t, dur, 0.12);
          o.start(t);
          o.stop(t + dur + 0.1);
        });
      },
      playStep(step, t, stepDur) {
        const beat = step % 4 === 0;
        const kickSteps = this.genre === 'hype' ? [0, 4, 8, 12] : [0, 8];
        if (kickSteps.includes(step)) this.kick(t);
        if (step % 2 === 1) this.hat(t);
        if (step % 8 === 0) {
          const r = this.root;
          this.bass(t, r / 2, stepDur * 7);
          const third = this.genre === 'synthwave' ? 1.26 : 1.2;
          this.pad(t, [r, r * third, r * 1.5], stepDur * 15);
        } else if (this.genre !== 'hype' && step % 4 === 2) {
          this.bass(t, this.root / 2 / 1.2, stepDur * 3);
        }
      },
    };

    function renderDjCommand(cmd, elapsed, color) {
      const W = (cmd._djRect && cmd._djRect.w) || 420;
      const H = (cmd._djRect && cmd._djRect.h) || 320;
      const bpm = cmd.bpm || 84;
      const beatMs = 60000 / bpm;
      const beatPhase = (elapsed % beatMs) / beatMs;
      DJAudio.ensure(cmd.genre || 'lofi', bpm, cmd.chordRoot || 261.63);

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.fillStyle = '#f8fafc';
      ctx.font = '800 17px "Segoe UI", sans-serif';
      ctx.fillText(`${(cmd.genre || 'lofi').toUpperCase()} • ${bpm} BPM`, W / 2, 30);

      const bars = 26;
      const bw = (W - 40) / bars;
      const seedStep = Math.floor(elapsed / (beatMs / 2));
      for (let i = 0; i < bars; i++) {
        const envelope = 0.35 + 0.65 * Math.abs(Math.sin((i / bars) * Math.PI));
        const wobble =
          0.5 +
          0.5 *
            Math.sin(seedStep * 1.7 + i * 0.9 + (cmd.genre === 'hype' ? seedStep * 0.6 : 0));
        const boost = i % 6 === Math.floor(beatPhase * 6) % 6 ? 0.25 : 0;
        const h = Math.max(8, (H - 130) * envelope * (0.35 + 0.65 * wobble + boost) * 0.62);
        const x = 20 + i * bw;
        const grad = ctx.createLinearGradient(0, H - 60 - h, 0, H - 60);
        grad.addColorStop(0, '#a78bfa');
        grad.addColorStop(1, '#38bdf8');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(x + 2, H - 60 - h, bw - 4, h, 3);
        ctx.fill();
      }

      ctx.strokeStyle = 'rgba(148, 163, 184, 0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(16, H - 58);
      ctx.lineTo(W - 16, H - 58);
      ctx.stroke();

      ctx.strokeStyle = '#a78bfa';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      for (let x = 16; x <= W - 16; x += 6) {
        const y =
          H - 28 +
          Math.sin(x / 22 + elapsed / 130) * 9 * Math.sin(beatPhase * Math.PI);
        x === 16 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();

      const pr = 10 + (1 - beatPhase) * 14;
      ctx.strokeStyle = 'rgba(167, 139, 250, 0.9)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(W - 34, 30, pr, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = '#a78bfa';
      ctx.beginPath();
      ctx.arc(W - 34, 30, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // =========================================================================
    // 5j. ATHLETIC BIOMECHANICS PROTRACTOR (live joint angles on the ACTOR rig)
    // =========================================================================
    function jointAngleDeg(a, b, c) {
      if (!a || !b || !c) return 180;
      const v1x = a.x - b.x, v1y = a.y - b.y;
      const v2x = c.x - b.x, v2y = c.y - b.y;
      const m = Math.hypot(v1x, v1y) * Math.hypot(v2x, v2y);
      if (!m) return 180;
      const dot = (v1x * v2x + v1y * v2y) / m;
      return (Math.acos(Math.max(-1, Math.min(1, dot))) * 180) / Math.PI;
    }

    function drawJointProtractor(a, b, c, label) {
      if (!a || !b || !c) return;
      const ang = jointAngleDeg(a, b, c);
      const r = 30;
      const a1 = Math.atan2(a.y - b.y, a.x - b.x);
      const a2 = Math.atan2(c.y - b.y, c.x - b.x);
      let delta = a2 - a1;
      while (delta <= -Math.PI) delta += 2 * Math.PI;
      while (delta > Math.PI) delta -= 2 * Math.PI;
      ctx.save();
      ctx.strokeStyle = 'rgba(250, 204, 21, 0.9)';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(b.x, b.y, r, a1, a1 + delta, delta < 0);
      ctx.stroke();
      const mid = a1 + delta / 2;
      ctx.fillStyle = '#facc15';
      ctx.font = '700 12px "Consolas", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const lx = b.x + Math.cos(mid) * (r + 20);
      const ly = b.y + Math.sin(mid) * (r + 20);
      ctx.fillText(`${Math.round(ang)}°`, lx, ly);
      if (label) {
        ctx.font = '600 10px "Segoe UI", sans-serif';
        ctx.fillStyle = 'rgba(250, 204, 21, 0.8)';
        ctx.fillText(label, lx, ly + 13);
      }
      ctx.restore();
    }

    // =========================================================================
    // 5k. AIM TRAINER + LIVE HAND-TRACE TELEMETRY HUD
    // Flick / tracking / micro drills with ideal-vs-actual trace and live
    // Path Efficiency %, Overshoot %, Micro-Jitter px and peak velocity.
    // =========================================================================
    function renderAimTrainerCommand(cmd, elapsedMs, color) {
      const W = (cmd._aimRect && cmd._aimRect.w) || 440;
      const H = (cmd._aimRect && cmd._aimRect.h) || 370;
      const t = elapsedMs / 1000;
      const mode = (cmd.drillMode || 'flick').toLowerCase();
      const cx = W / 2;
      const cy = H * 0.44;
      const rArea = Math.min(W * 0.4, H * 0.37);

      ctx.save();
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.32)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(cx, cy, rArea, 0, Math.PI * 2);
      ctx.arc(cx, cy, rArea * (mode === 'micro' ? 0.45 : 0.6), 0, Math.PI * 2);
      ctx.moveTo(cx - rArea, cy);
      ctx.lineTo(cx + rArea, cy);
      ctx.moveTo(cx, cy - rArea);
      ctx.lineTo(cx, cy + rArea);
      ctx.stroke();
      ctx.restore();

      let tx, ty, px, py, flickP;
      if (mode === 'tracking') {
        tx = cx + Math.sin(t * 1.7) * rArea * 0.7;
        ty = cy + Math.sin(t * 2.3 + 1.1) * rArea * 0.62;
        px = cx + Math.sin((t - 0.06) * 1.7) * rArea * 0.7;
        py = cy + Math.sin((t - 0.06) * 2.3 + 1.1) * rArea * 0.62;
        flickP = 1;
      } else {
        const stepHz = mode === 'micro' ? 2.2 : 1.4;
        const idx = Math.floor(t * stepHz);
        flickP = Math.min(1, ((t * stepHz) % 1) * 1.6);
        const amp = mode === 'micro' ? rArea * 0.34 : rArea * 0.72;
        tx = cx + Math.sin(idx * 2.3) * amp;
        ty = cy + Math.cos(idx * 1.7) * amp * 0.9;
        px = cx + Math.sin((idx - 1) * 2.3) * amp;
        py = cy + Math.cos((idx - 1) * 1.7) * amp * 0.9;
      }

      const ctrlX = (px + tx) / 2 + rArea * 0.14;
      const ctrlY = (py + ty) / 2 - rArea * 0.14;
      const quad = (u) => {
        const iu = 1 - u;
        return {
          x: iu * iu * px + 2 * iu * u * ctrlX + u * u * tx,
          y: iu * iu * py + 2 * iu * u * ctrlY + u * u * ty,
        };
      };

      ctx.save();
      ctx.strokeStyle = 'rgba(74, 222, 128, 0.55)';
      ctx.setLineDash([5, 5]);
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(tx, ty);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.strokeStyle = 'rgba(34, 211, 238, 0.45)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (let u = 0; u <= 1.001; u += 0.08) {
        const p = quad(u);
        u === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();

      const e = flickP < 0.5 ? 2 * flickP * flickP : 1 - Math.pow(-2 * flickP + 2, 2) / 2;
      const cur = quad(e);
      const wob = rArea / 105;
      const curX = cur.x + Math.sin(e * Math.PI * 2) * 11 * wob * (1 - e);
      const curY = cur.y + Math.cos(e * Math.PI * 2) * 9 * wob * (1 - e);

      ctx.strokeStyle = color;
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.moveTo(px, py);
      for (let u = 0.08; u <= e + 0.001; u += 0.08) {
        const p = quad(Math.min(1, u));
        ctx.lineTo(p.x + Math.sin(u * Math.PI * 2) * 11 * wob * (1 - u), p.y + Math.cos(u * Math.PI * 2) * 9 * wob * (1 - u));
      }
      ctx.lineTo(curX, curY);
      ctx.stroke();

      ctx.fillStyle = '#ff5252';
      ctx.shadowColor = '#ff5252';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(tx, ty, mode === 'micro' ? 9 : 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.strokeStyle = '#4ade80';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(curX, curY, 6, 0, Math.PI * 2);
      ctx.moveTo(curX - 11, curY);
      ctx.lineTo(curX - 3, curY);
      ctx.moveTo(curX + 3, curY);
      ctx.lineTo(curX + 11, curY);
      ctx.moveTo(curX, curY - 11);
      ctx.lineTo(curX, curY - 3);
      ctx.moveTo(curX, curY + 3);
      ctx.lineTo(curX, curY + 11);
      ctx.stroke();
      ctx.restore();

      // Live telemetry HUD - same straight-line metrics as the hand analyzer:
      // efficiency = ideal / actual length, overshoot = projection past target,
      // jitter = mean perpendicular deviation of the traced curve.
      const ideal = Math.hypot(tx - px, ty - py) || 1;
      const ux = (tx - px) / ideal;
      const uy = (ty - py) / ideal;
      let actual = 0;
      let maxProj = 0;
      let perpSum = 0;
      let prev = { x: px, y: py };
      for (let u = 0.05; u <= 1.0001; u += 0.05) {
        const p = quad(Math.min(1, u));
        const sx = p.x + Math.sin(u * Math.PI * 2) * 11 * wob * (1 - u);
        const sy = p.y + Math.cos(u * Math.PI * 2) * 9 * wob * (1 - u);
        actual += Math.hypot(sx - prev.x, sy - prev.y);
        prev = { x: sx, y: sy };
        const dx = sx - px;
        const dy = sy - py;
        const proj = dx * ux + dy * uy;
        if (proj > maxProj) maxProj = proj;
        perpSum += Math.abs(dx * -uy + dy * ux);
      }
      const eff = Math.min(100, Math.round((ideal / Math.max(ideal, actual)) * 100));
      const over = Math.max(0, Math.round(((maxProj - ideal) / ideal) * 100));
      const jit = (perpSum / 21).toFixed(1);
      const flickSec = mode === 'tracking' ? 1 : Math.max(0.12, 1 / (mode === 'micro' ? 2.2 : 1.4) / 1.6);
      const vel = Math.round(actual / flickSec);

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#f8fafc';
      ctx.font = '800 13px "Segoe UI", sans-serif';
      ctx.fillText(`${(mode || 'flick').toUpperCase()} DRILL${cmd.dpi ? ` • ${cmd.dpi} DPI` : ''}${cmd.cmPer360 ? ` • ${cmd.cmPer360} cm/360°` : ''}`, W / 2, H - 34);
      ctx.fillStyle = '#7dd3fc';
      ctx.font = '700 12.5px "Consolas", monospace';
      ctx.fillText(`Path ${eff}% • Over ${over}% • Jitter ${jit}px • ${vel} px/s`, W / 2, H - 14);
      ctx.restore();
    }

    function renderFrame(now) {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      let stillAnimating = false;

      for (const cmd of activeCommands) {
        if (cmd.skip) continue;
        const elapsed = now - cmd.startTime;
        if (elapsed < 0) { stillAnimating = true; continue; }

        const duration = cmd.duration || 750;
        const progress = Math.min(1, elapsed / duration);
        // loop commands (ANIMATE, rotating 3D shapes) keep the RAF chain alive forever
        if (progress < 1 || cmd.loop) stillAnimating = true;

        const ease = 1 - Math.pow(1 - progress, 3);
        const color = resolveBrightColor(cmd.color, '#38bdf8');

        ctx.save();
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = cmd.lineWidth || 3.2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
        ctx.shadowBlur = 6;

        if (cmd.type === 'TOPIC_BANNER') {
          ctx.font = '700 16px "Segoe UI", sans-serif';
          const w = Math.max(260, ctx.measureText(cmd.label).width + 36);
          ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.roundRect(cmd.x, cmd.y, w, 38, 10);
          ctx.fill();
          ctx.stroke();

          ctx.shadowBlur = 0;
          ctx.fillStyle = '#38bdf8';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillText(cmd.label, cmd.x + 16, cmd.y + 19);
        }

        else if (cmd.type === 'ANIMATE') {
          ctx.save();
          ctx.translate(cmd._animDx || 0, cmd._animDy || 0);
          renderAnimatedGifCommand(cmd, elapsed, color);
          ctx.restore();
          if (cmd.label && cmd._animRect) {
            drawLabelPill(cmd, cmd.label, cmd._animRect.x + cmd._animRect.w / 2, cmd._animRect.y - 16, color);
          }
        }

        else if (cmd.type === 'ACTOR') {
          ctx.save();
          ctx.translate(cmd._actDx || 0, cmd._actDy || 0);
          renderDynamicActorCommand(cmd, elapsed, color);
          ctx.restore();
          if (cmd.label && cmd._actorRect) {
            drawLabelPill(
              cmd,
              `${cmd.label} (${(cmd.pov || '3rd').toUpperCase()} POV)`,
              cmd._actorRect.x + cmd._actorRect.w / 2,
              cmd._actorRect.y - 16,
              color
            );
          }
        }

        else if (cmd.type === 'KEYFRAMES') {
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(cmd._kfRect.x - 6, cmd._kfRect.y - 6, cmd._kfRect.w + 12, cmd._kfRect.h + 12, 12);
          ctx.clip();
          ctx.translate(cmd._kfDx || 0, cmd._kfDy || 0);
          renderKeyframesCommand(cmd, elapsed, color);
          ctx.restore();
          if (cmd.label && cmd._kfRect) {
            drawLabelPill(cmd, cmd.label, cmd._kfRect.x + cmd._kfRect.w / 2, cmd._kfRect.y - 16, color);
          }
        }

        else if (cmd.type === 'GRAPH') {
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(cmd._gRect.x - 6, cmd._gRect.y - 6, cmd._gRect.w + 12, cmd._gRect.h + 12, 12);
          ctx.clip();
          ctx.translate(cmd._gDx || 0, cmd._gDy || 0);
          renderGraphCommand(cmd, elapsed, color);
          ctx.restore();
          if (cmd.label && cmd._gRect) {
            drawLabelPill(cmd, cmd.label, cmd._gRect.x + cmd._gRect.w / 2, cmd._gRect.y - 16, color);
          }
        }

        else if (cmd.type === 'TRACE') {
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(cmd._traceRect.x - 6, cmd._traceRect.y - 6, cmd._traceRect.w + 12, cmd._traceRect.h + 12, 12);
          ctx.clip();
          ctx.translate(cmd._tDx || 0, cmd._tDy || 0);
          renderTraceCommand(cmd, elapsed, color);
          ctx.restore();
          if (cmd.label && cmd._traceRect) {
            drawLabelPill(cmd, cmd.label, cmd._traceRect.x + cmd._traceRect.w / 2, cmd._traceRect.y - 16, color);
          }
        }

        else if (cmd.type === 'FIELD') {
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(cmd._fieldRect.x - 6, cmd._fieldRect.y - 6, cmd._fieldRect.w + 12, cmd._fieldRect.h + 12, 12);
          ctx.clip();
          ctx.translate(cmd._fDx || 0, cmd._fDy || 0);
          renderFieldCommand(cmd, elapsed, color);
          ctx.restore();
          if (cmd.label && cmd._fieldRect) {
            drawLabelPill(cmd, cmd.label, cmd._fieldRect.x + cmd._fieldRect.w / 2, cmd._fieldRect.y - 16, color);
          }
        }

        else if (cmd.type === 'DJ') {
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(cmd._djRect.x - 6, cmd._djRect.y - 6, cmd._djRect.w + 12, cmd._djRect.h + 12, 12);
          ctx.clip();
          ctx.translate(cmd._djDx || 0, cmd._djDy || 0);
          renderDjCommand(cmd, elapsed, color);
          ctx.restore();
          if (cmd.label && cmd._djRect) {
            drawLabelPill(cmd, cmd.label, cmd._djRect.x + cmd._djRect.w / 2, cmd._djRect.y - 16, color);
          }
        }

        else if (cmd.type === 'AIM_TRAINER') {
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(cmd._aimRect.x - 6, cmd._aimRect.y - 6, cmd._aimRect.w + 12, cmd._aimRect.h + 12, 12);
          ctx.clip();
          ctx.translate(cmd._aimDx || 0, cmd._aimDy || 0);
          renderAimTrainerCommand(cmd, elapsed, color);
          ctx.restore();
          if (cmd.label && cmd._aimRect) {
            drawLabelPill(cmd, cmd.label, cmd._aimRect.x + cmd._aimRect.w / 2, cmd._aimRect.y - 16, color);
          }
        }

        else if (cmd.type === 'UIRECT') {
          // Dashed glow frame that grows out of the scanned control's true
          // screen rect during the 750ms draw-in, then freezes (no loop).
          // No clipping: the control may legitimately sit under the notes zone.
          const x = cmd.x, y = cmd.y, w = cmd.w, h = cmd.h;
          const pad = 4;
          const dw = Math.max(10, (w + pad * 2) * ease);
          const dh = Math.max(8, (h + pad * 2) * ease);

          ctx.save();
          ctx.setLineDash([9, 6]);
          ctx.lineWidth = 3;
          ctx.strokeStyle = color;
          ctx.beginPath();
          ctx.roundRect(x - pad, y - pad, dw, dh, 7);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 0.16 * ease;
          ctx.fillStyle = color;
          ctx.fill();
          ctx.globalAlpha = 1;
          ctx.shadowBlur = 0;
          ctx.restore();

          if (cmd.label && progress > 0.35) {
            drawLabelPill(cmd, cmd.label, x + w / 2, y - 14, color);
          }
        }

        else if (cmd.type === 'ANATOMY') {
          // Clip to the diagram zone so callouts can never paint over notes.
          ctx.save();
          ctx.beginPath();
          ctx.rect(0, 0, Math.max(140, NOTES_MIN_X - 6), window.innerHeight);
          ctx.clip();
          renderAnatomyAndBiologyCommand(cmd, elapsed, ease);
          ctx.restore();
          if (cmd.label && cmd._anatRect) {
            drawLabelPill(cmd, cmd.label, cmd._anatRect.x + cmd._anatRect.w / 2, cmd._anatRect.y - 16, color);
          }
        }

        else if (cmd.type === 'SVG' && cmd.d) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(0, 0, Math.max(140, NOTES_MIN_X - 6), window.innerHeight);
          ctx.clip();
          try {
            if (cmd._pathLen === undefined) {
              const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
              pathEl.setAttribute('d', cmd.d);
              cmd._pathLen = pathEl.getTotalLength() || 0;
              // Sample the path to find its bounding box so any path data
              // fits inside the claimed rect regardless of its raw units.
              let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
              const samples = Math.max(2, Math.min(256, Math.ceil(cmd._pathLen / 4) || 2));
              for (let i = 0; i <= samples; i++) {
                const pt = pathEl.getPointAtLength((cmd._pathLen * i) / samples);
                if (pt.x < minX) minX = pt.x;
                if (pt.x > maxX) maxX = pt.x;
                if (pt.y < minY) minY = pt.y;
                if (pt.y > maxY) maxY = pt.y;
              }
              cmd._bbox = { cx: (minX + maxX) / 2, cy: (minY + maxY) / 2,
                            w: Math.max(1, maxX - minX), h: Math.max(1, maxY - minY) };
            }
            const rect = cmd._anatRect || { x: cmd.cx - 150, y: cmd.cy - 120, w: 300, h: 240 };
            const bbox = cmd._bbox;
            const fit = bbox
              ? Math.min(rect.w / bbox.w, rect.h / bbox.h)
              : 1;
            const sc = fit * (cmd.scale || 1);
            ctx.translate(cmd.cx || 200, cmd.cy || 200);
            ctx.scale(sc, sc);
            if (bbox) ctx.translate(-bbox.cx, -bbox.cy);
            if (cmd._pathLen > 0) {
              // Progressive stroke reveal over the 750ms draw-in.
              ctx.setLineDash([cmd._pathLen, cmd._pathLen]);
              ctx.lineDashOffset = cmd._pathLen * (1 - ease);
            }
            ctx.stroke(new Path2D(cmd.d));
            ctx.setLineDash([]);
            ctx.lineDashOffset = 0;
          } catch { /* invalid path data: skip this frame */ }
          ctx.restore();
          if (cmd.label && cmd._anatRect) {
            drawLabelPill(cmd, cmd.label, cmd._anatRect.x + cmd._anatRect.w / 2, cmd._anatRect.y - 16, color);
          }
        }

        else if (cmd.type === 'WRITE') {
          const lines = cmd.wrappedLines || [cmd.label || ''];
          ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.38)';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.roundRect(cmd.x, cmd.y, cmd.cardW, cmd.cardH, 9);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.roundRect(cmd.x, cmd.y, 4, cmd.cardH, 2);
          ctx.fill();

          ctx.shadowBlur = 0;
          ctx.font = '600 15.5px "Segoe UI", sans-serif';
          ctx.fillStyle = '#f8fafc';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'alphabetic';
          lines.forEach((line, idx) => {
            const chars = Math.max(1, Math.floor(line.length * ease));
            ctx.fillText(line.slice(0, chars), cmd.x + 14, cmd.y + 22 + idx * 23);
          });
        }

        else if (cmd.type === 'CURVE' || cmd.type === 'POLYGON') {
          const pts = cmd.type === 'CURVE'
            ? (cmd.smoothPoints || (cmd.smoothPoints = getSmoothSplinePoints(cmd.points, 16)))
            : (cmd.points || []);
          if (pts.length >= 2) {
            const count = Math.max(2, Math.floor(pts.length * ease));
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < count; i++) ctx.lineTo(pts[i].x, pts[i].y);
            if (cmd.type === 'POLYGON' && progress >= 0.98 && cmd.closed !== false) ctx.closePath();
            ctx.stroke();
            if (progress < 1) drawPenTip(pts[count - 1].x, pts[count - 1].y, color);
            if (cmd.label && progress > 0.55) {
              drawLabelPill(cmd, cmd.label, pts[0].x, pts[0].y - 22, color);
            }
          }
        }

        else if (cmd.type === 'ARROW') {
          const curX = cmd.x1 + (cmd.x2 - cmd.x1) * ease;
          const curY = cmd.y1 + (cmd.y2 - cmd.y1) * ease;
          ctx.beginPath();
          ctx.moveTo(cmd.x1, cmd.y1);
          ctx.lineTo(curX, curY);
          ctx.stroke();

          const angle = Math.atan2(cmd.y2 - cmd.y1, cmd.x2 - cmd.x1);
          const head = 13;
          ctx.beginPath();
          ctx.moveTo(curX, curY);
          ctx.lineTo(curX - head * Math.cos(angle - Math.PI / 6), curY - head * Math.sin(angle - Math.PI / 6));
          ctx.lineTo(curX - head * Math.cos(angle + Math.PI / 6), curY - head * Math.sin(angle + Math.PI / 6));
          ctx.closePath();
          ctx.fill();

          if (progress < 1) drawPenTip(curX, curY, color);
          if (cmd.label && progress > 0.45) {
            drawLabelPill(cmd, cmd.label, cmd.x2 + Math.cos(angle) * 18, cmd.y2 + Math.sin(angle) * 18, color);
          }
        }

        else if (cmd.type === 'BOX') {
          ctx.strokeRect(cmd.x, cmd.y, cmd.w * ease, cmd.h * ease);
          if (cmd.label && progress > 0.5) {
            drawLabelPill(cmd, cmd.label, cmd.x + cmd.w / 2, cmd.y - 20, color);
          }
        }
        else if (cmd.type === 'CIRCLE' || cmd.type === 'BEACON') {
          ctx.beginPath();
          ctx.arc(cmd.x, cmd.y, cmd.r || 36, 0, Math.PI * 2 * ease);
          ctx.stroke();
          if (cmd.label && progress > 0.5) {
            drawLabelPill(cmd, cmd.label, cmd.x, cmd.y - (cmd.r || 36) - 20, color);
          }
        }

        else if (cmd.type === 'PLOT') {
          const { x, y, w, h, xMin, xMax, expr } = cmd;
          if (!isValidMathExpression(expr)) { ctx.restore(); continue; }
          if (!cmd.sampledPoints) {
            const fn = compileMathExpression(expr);
            const raw = [];
            let yMin = Infinity, yMax = -Infinity;
            for (let i = 0; i <= 180; i++) {
              const xv = xMin + (i / 180) * (xMax - xMin);
              const yv = fn(xv);
              raw.push({ xv, yv });
              if (Number.isFinite(yv) && Math.abs(yv) < 1e4) {
                if (yv < yMin) yMin = yv;
                if (yv > yMax) yMax = yv;
              }
            }
            if (!Number.isFinite(yMin) || yMin === yMax) { yMin = -10; yMax = 10; }
            else { const pad = (yMax - yMin) * 0.15 || 2; yMin -= pad; yMax += pad; }
            cmd.yMin = yMin; cmd.yMax = yMax;
            cmd.sampledPoints = raw.map(pt => {
              if (!Number.isFinite(pt.yv)) return null;
              return {
                x: x + ((pt.xv - xMin) / (xMax - xMin)) * w,
                y: y + h - ((pt.yv - yMin) / (yMax - yMin)) * h
              };
            });
          }

          ctx.strokeStyle = 'rgba(248, 250, 252, 0.55)';
          ctx.lineWidth = 1.6;
          const zeroX = x + ((0 - xMin) / (xMax - xMin)) * w;
          const zeroY = y + h - ((0 - cmd.yMin) / (cmd.yMax - cmd.yMin)) * h;
          if (zeroX >= x && zeroX <= x + w) { ctx.beginPath(); ctx.moveTo(zeroX, y); ctx.lineTo(zeroX, y + h); ctx.stroke(); }
          if (zeroY >= y && zeroY <= y + h) { ctx.beginPath(); ctx.moveTo(x, zeroY); ctx.lineTo(x + w, zeroY); ctx.stroke(); }

          ctx.strokeStyle = color;
          ctx.lineWidth = 3.4;
          const maxIdx = Math.floor(cmd.sampledPoints.length * ease);
          ctx.beginPath();
          let penDown = false, lastPt = null;
          for (let i = 0; i < maxIdx; i++) {
            const pt = cmd.sampledPoints[i];
            if (!pt || pt.y < y - 8 || pt.y > y + h + 8) { penDown = false; continue; }
            if (!penDown) { ctx.moveTo(pt.x, pt.y); penDown = true; }
            else ctx.lineTo(pt.x, pt.y);
            lastPt = pt;
          }
          ctx.stroke();
          if (progress < 1 && lastPt) drawPenTip(lastPt.x, lastPt.y, color);
          if (progress > 0.4) drawLabelPill(cmd, `y = ${expr}`, x + w / 2, y - 18, color);
        }

        else if (cmd.type === 'SHAPE3D') {
          if (!cmd.edges3D) cmd.edges3D = build3DShapeEdges(cmd.shapeType, cmd.cx, cmd.cy, cmd.size, cmd.pitch, cmd.yaw);
          const count = Math.max(1, Math.floor(cmd.edges3D.length * ease));
          for (let i = 0; i < count; i++) {
            const e = cmd.edges3D[i];
            ctx.save();
            ctx.strokeStyle = e.color || color;
            if (e.dashed) ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.moveTo(e.p1.x, e.p1.y);
            ctx.lineTo(e.p2.x, e.p2.y);
            ctx.stroke();
            if (e.axisLabel && progress >= 1) drawLabelPill(cmd, e.axisLabel, e.p2.x, e.p2.y, e.color || color);
            ctx.restore();
          }
          if (cmd.label && progress > 0.5) drawLabelPill(cmd, cmd.label, cmd.cx, cmd.cy - cmd.size - 22, color);
        }

        else if (cmd.type === 'POLY3D') {
          if (!cmd.projectedPts && cmd.points3D) {
            cmd.projectedPts = cmd.points3D.map(pt =>
              project3DPoint(pt.x, pt.y, pt.z, cmd.cx || 280, cmd.cy || 300, cmd.scale || 90, 0.42, 0.65)
            );
          }
          const pts = cmd.projectedPts || [];
          if (pts.length >= 2) {
            if (cmd.dashed) ctx.setLineDash([6, 6]);
            const count = Math.max(2, Math.floor(pts.length * ease));
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < count; i++) ctx.lineTo(pts[i].x, pts[i].y);
            ctx.stroke();
            if (progress < 1) drawPenTip(pts[count - 1].x, pts[count - 1].y, color);
            if (cmd.label && progress > 0.6) drawLabelPill(cmd, cmd.label, pts[0].x, pts[0].y - 18, color);
          }
        }

        ctx.restore();
      }

      if (!activeCommands.some((c) => !c.skip && c.type === 'DJ')) DJAudio.stop();

      if (stillAnimating) animationFrameId = requestAnimationFrame(renderFrame);
      else animationFrameId = null;
    }

    function addOverlayCommands(newCommands, clearExisting = false) {
      if (clearExisting) {
        activeCommands = [];
        resetLayoutState();
      }
      const now = performance.now();
      const prepared = [];
      (newCommands || []).forEach((rawCmd, idx) => {
        const cmd = { ...rawCmd };
        cmd.type = (cmd.type || '').toUpperCase();
        prepared.push({ cmd, idx });
      });

      // Layout order: topic banner first, then the notes (they own the right
      // column), then diagram shapes from BIGGEST to smallest so the rigid
      // plot/3D shapes claim space first and small labels work around them.
      // Animation order still follows the original command index.
      const diagramArea = (c) => {
        if (c.type === 'ACTOR') return 450 * 360;
        if (c.type === 'ANATOMY') return 460 * 470;
        if (c.type === 'SVG') return 300 * 240;
        if (c.type === 'ANIMATE') return 470 * 380;
        if (c.type === 'KEYFRAMES') return 460 * 380;
        if (c.type === 'GRAPH') return 400 * 340;
        if (c.type === 'TRACE') return 430 * 240;
        if (c.type === 'FIELD') return 390 * 290;
        if (c.type === 'DJ') return 420 * 320;
        if (c.type === 'AIM_TRAINER') return 440 * 370;
        if (c.type === 'PLOT') return (c.w || 400) * (c.h || 310);
        if (c.type === 'SHAPE3D') return 4 * (c.size || 90) * (c.size || 90);
        if (c.type === 'POLY3D') return 380 * 340;
        if (c.type === 'BOX') return (c.w || 150) * (c.h || 100);
        if (c.type === 'CIRCLE' || c.type === 'BEACON') return 4 * (c.r || 40) * (c.r || 40);
        return 0;
      };
      const shapes = prepared
        .filter(p => p.cmd.type !== 'BOARD' && !isNoteCommand(p.cmd))
        .sort((a, b) => diagramArea(b.cmd) - diagramArea(a.cmd));
      const layoutOrder = [
        ...prepared.filter(p => p.cmd.type === 'BOARD'),
        ...prepared.filter(p => isNoteCommand(p.cmd)),
        ...shapes
      ];
      layoutOrder.forEach(p => layoutCommand(p.cmd));

      prepared.forEach(({ cmd, idx }) => {
        if (cmd.skip) return;
        cmd.startTime = now + (cmd.delayMs !== undefined ? cmd.delayMs : idx * 220);
        cmd.duration = cmd.duration || 750;
        activeCommands.push(cmd);
      });

      if (activeCommands.length > MAX_COMMANDS) {
        activeCommands = activeCommands.slice(activeCommands.length - MAX_COMMANDS);
      }

      if (activeCommands.length > 0) {
        voidBackdrop.classList.add('active');
      }

      if (!animationFrameId) animationFrameId = requestAnimationFrame(renderFrame);
    }

    function clearOverlay() {
      activeCommands = [];
      resetLayoutState();
      DJAudio.stop();
      voidBackdrop.classList.remove('active');
      if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      subtitleBanner.style.display = 'none';
    }

    window.ClickyOverlay = {
      addCommands: addOverlayCommands,
      clear: clearOverlay,
      setSubtitle(text) {
        if (!text) subtitleBanner.style.display = 'none';
        else {
          voidBackdrop.classList.add('active');
          subtitleBanner.textContent = text;
          subtitleBanner.style.display = 'block';
        }
      }
    };

    // =========================================================================
    // 6. IPC (drawing channels + buddy/voice/TTS channels used by the main process)
    // =========================================================================
    ipcRenderer.on('overlay:draw', (_e, payload) => {
      if (Array.isArray(payload)) addOverlayCommands(payload, false);
      else if (payload && Array.isArray(payload.commands)) {
        addOverlayCommands(payload.commands, !!payload.clear);
        if (payload.subtitle !== undefined) window.ClickyOverlay.setSubtitle(payload.subtitle);
      }
    });
    ipcRenderer.on('overlay:clear', () => clearOverlay());
    ipcRenderer.on('clear-drawings', () => clearOverlay());
    ipcRenderer.on('overlay:subtitle', (_e, text) => window.ClickyOverlay.setSubtitle(text));

    // Interactive prompt bar (File 29): shown when the main process turns
    // click-through off (Ctrl+Shift+Space). Submits through the same
    // pipeline as voice transcripts, then returns to click-through mode.
    const promptBar = document.getElementById('prompt-bar');
    const promptInput = document.getElementById('prompt-input');
    ipcRenderer.on('overlay:click-through-changed', (_e, isClickThrough) => {
      if (isClickThrough) {
        promptBar.classList.remove('interactive');
        promptInput.value = '';
      } else {
        promptBar.classList.add('interactive');
        promptInput.focus();
      }
    });
    promptBar.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = promptInput.value.trim();
      if (!text) return;
      promptInput.value = '';
      try {
        await ipcRenderer.invoke('overlay:submit-prompt', text);
      } catch {
        /* submit is best-effort; still return to click-through */
      }
      ipcRenderer.send('overlay:set-click-through', true);
    });

    // =========================================================================
    // 7. BUDDY CURSOR (triangle flight, waveform, spinner, speech bubble)
    // =========================================================================
    const buddyRoot = document.getElementById('buddy-root');
    const triangle = document.getElementById('triangle');
    const waveform = document.getElementById('waveform');
    const waveBars = Array.from(document.querySelectorAll('.wave-bar'));
    const spinner = document.getElementById('spinner');
    const speechBubble = document.getElementById('speech-bubble');

    const listeningBarProfile = [0.4, 0.7, 1.0, 0.7, 0.4];
    const navigationPointerPhrases = ['right here!', 'this one!', 'over here!', 'click this!', 'here it is!'];

    let buddyNavigationMode = 'followingCursor';
    let isReturningToCursor = false;
    let isCursorOnThisScreen = true;
    let anotherScreenNavigating = false;

    let cursorPosition = { x: 300, y: 300 };
    let targetMousePosition = { x: 300, y: 300 };
    let cursorPositionWhenNavigationStarted = { x: 0, y: 0 };

    let triangleRotationDegrees = -35.0;
    let buddyFlightScale = 1.0;
    let currentAudioPowerLevel = 0;
    let voiceState = 'idle';
    let currentAudioElement = null;

    function stopActiveAudio() {
      speechSynthesis.cancel();
      if (currentAudioElement) {
        try { currentAudioElement.pause(); currentAudioElement.currentTime = 0; } catch (e) {}
        currentAudioElement = null;
      }
    }
    ipcRenderer.on('stop-tts-audio', stopActiveAudio);

    ipcRenderer.on('trigger-welcome', () => {
      streamTextInBubble("hey! i'm clicky", () => setTimeout(hideBubble, 2500));
    });

    ipcRenderer.on('cursor-tick', (_, payload) => {
      isCursorOnThisScreen = payload.isCursorOnThisScreen;
      anotherScreenNavigating = payload.anotherScreenNavigating;
      if (isCursorOnThisScreen) {
        targetMousePosition = { x: payload.localX + 35, y: payload.localY + 25 };
      }
      if (buddyNavigationMode === 'navigatingToTarget' && isReturningToCursor) {
        const dist = Math.hypot(
          payload.localX - cursorPositionWhenNavigationStarted.x,
          payload.localY - cursorPositionWhenNavigationStarted.y
        );
        if (dist > 100) finishNavigationAndResumeFollowing();
      }
    });

    function buddyLoop(now) {
      const visible = buddyNavigationMode === 'followingCursor'
        ? (!anotherScreenNavigating && isCursorOnThisScreen)
        : true;
      buddyRoot.style.opacity = visible ? '1' : '0';

      if (buddyNavigationMode === 'followingCursor') {
        cursorPosition.x += (targetMousePosition.x - cursorPosition.x) * 0.22;
        cursorPosition.y += (targetMousePosition.y - cursorPosition.y) * 0.22;
        triangleRotationDegrees = -35.0;
        buddyFlightScale = 1.0;
      }

      buddyRoot.style.transform =
        'translate3d(' + cursorPosition.x + 'px,' + cursorPosition.y + 'px,0) rotate(' +
        triangleRotationDegrees + 'deg) scale(' + buddyFlightScale + ')';

      if (speechBubble.style.opacity === '1') {
        speechBubble.style.left = cursorPosition.x + 18 + 'px';
        speechBubble.style.top = cursorPosition.y + 8 + 'px';
      }

      if (voiceState === 'listening') {
        waveBars.forEach((bar, idx) => {
          const phase = (now / 1000) * 3.6 + idx * 0.35;
          const normPower = Math.max(currentAudioPowerLevel - 0.008, 0);
          const easedPower = Math.pow(Math.min(normPower * 2.85, 1), 0.76);
          const reactiveHeight = easedPower * 10 * listeningBarProfile[idx];
          const idlePulse = ((Math.sin(phase) + 1) / 2) * 1.5;
          bar.style.height = 3 + reactiveHeight + idlePulse + 'px';
        });
      }

      requestAnimationFrame(buddyLoop);
    }
    requestAnimationFrame(buddyLoop);

    function animateBezierFlightArc(destination, onComplete) {
      const startPosition = { ...cursorPosition };
      const endPosition = { ...destination };
      const distance = Math.hypot(endPosition.x - startPosition.x, endPosition.y - startPosition.y);
      const flightDurationMs = Math.min(Math.max(distance / 800.0, 0.6), 1.4) * 1000;
      const startTime = performance.now();

      const midPoint = {
        x: (startPosition.x + endPosition.x) / 2.0,
        y: (startPosition.y + endPosition.y) / 2.0
      };
      const arcHeight = Math.min(distance * 0.2, 80.0);
      const controlPoint = { x: midPoint.x, y: midPoint.y - arcHeight };

      function step(now) {
        if (buddyNavigationMode !== 'navigatingToTarget') return;
        const linearProgress = Math.min((now - startTime) / flightDurationMs, 1.0);
        const t = linearProgress * linearProgress * (3.0 - 2.0 * linearProgress);
        const u = 1.0 - t;

        cursorPosition.x = u * u * startPosition.x + 2 * u * t * controlPoint.x + t * t * endPosition.x;
        cursorPosition.y = u * u * startPosition.y + 2 * u * t * controlPoint.y + t * t * endPosition.y;

        const tx = 2 * u * (controlPoint.x - startPosition.x) + 2 * t * (endPosition.x - controlPoint.x);
        const ty = 2 * u * (controlPoint.y - startPosition.y) + 2 * t * (endPosition.y - controlPoint.y);
        triangleRotationDegrees = Math.atan2(ty, tx) * (180.0 / Math.PI) + 90.0;
        buddyFlightScale = 1.0 + Math.sin(linearProgress * Math.PI) * 0.3;

        if (linearProgress < 1.0) requestAnimationFrame(step);
        else { buddyFlightScale = 1.0; onComplete(); }
      }
      requestAnimationFrame(step);
    }

    ipcRenderer.on('navigate-to-element', (_, { localX, localY, bubbleText }) => {
      buddyNavigationMode = 'navigatingToTarget';
      isReturningToCursor = false;
      cursorPositionWhenNavigationStarted = { x: targetMousePosition.x - 35, y: targetMousePosition.y - 25 };

      const clampedTarget = {
        x: Math.max(20, Math.min(localX + 8, window.innerWidth - 20)),
        y: Math.max(20, Math.min(localY + 12, window.innerHeight - 20))
      };

      animateBezierFlightArc(clampedTarget, () => {
        buddyNavigationMode = 'pointingAtTarget';
        triangleRotationDegrees = -35.0;
        const phrase = bubbleText ||
          navigationPointerPhrases[Math.floor(Math.random() * navigationPointerPhrases.length)];
        streamTextInBubble(phrase, () => {
          setTimeout(() => {
            if (buddyNavigationMode !== 'pointingAtTarget') return;
            hideBubble();
            setTimeout(() => {
              if (buddyNavigationMode !== 'pointingAtTarget') return;
              buddyNavigationMode = 'navigatingToTarget';
              isReturningToCursor = true;
              animateBezierFlightArc(targetMousePosition, finishNavigationAndResumeFollowing);
            }, 450);
          }, 4000);
        });
      });
    });

    function streamTextInBubble(phrase, onComplete) {
      speechBubble.textContent = '';
      speechBubble.style.opacity = '1';
      speechBubble.style.transform = 'scale(1)';
      let idx = 0;
      function nextChar() {
        if (idx < phrase.length) {
          speechBubble.textContent += phrase[idx++];
          setTimeout(nextChar, 30 + Math.random() * 25);
        } else if (onComplete) onComplete();
      }
      nextChar();
    }

    function hideBubble() {
      speechBubble.style.opacity = '0';
      speechBubble.style.transform = 'scale(0.5)';
    }

    function finishNavigationAndResumeFollowing() {
      buddyNavigationMode = 'followingCursor';
      isReturningToCursor = false;
      triangleRotationDegrees = -35.0;
      buddyFlightScale = 1.0;
      hideBubble();
      ipcRenderer.send('navigation-completed');
    }

    ipcRenderer.on('voice-state', (_, newState) => {
      voiceState = newState;
      triangle.style.display = (newState === 'idle' || newState === 'responding') ? 'block' : 'none';
      waveform.style.display = newState === 'listening' ? 'flex' : 'none';
      spinner.style.display = newState === 'processing' ? 'block' : 'none';
    });

    // =========================================================================
    // 8. DICTATION + TTS
    // =========================================================================
    let recognition = null;
    let latestTranscript = '';
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';
      recognition.onresult = (event) => {
        let text = '';
        for (let i = 0; i < event.results.length; i++) text += event.results[i][0].transcript;
        latestTranscript = text.trim();
      };
    }

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
        const audioCtx = new AudioContext();
        const source = audioCtx.createMediaStreamSource(stream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);
        const buffer = new Float32Array(analyser.fftSize);
        function pollAudioPower() {
          analyser.getFloatTimeDomainData(buffer);
          let sum = 0;
          for (let i = 0; i < buffer.length; i++) sum += buffer[i] * buffer[i];
          const rms = Math.sqrt(sum / buffer.length);
          currentAudioPowerLevel = Math.max(Math.min(Math.max(rms * 10.2, 0), 1), currentAudioPowerLevel * 0.72);
          requestAnimationFrame(pollAudioPower);
        }
        pollAudioPower();
      }).catch(() => {});
    }

    ipcRenderer.on('start-listening', () => {
      latestTranscript = '';
      stopActiveAudio();
      try { recognition && recognition.start(); } catch (e) {}
    });

    ipcRenderer.on('stop-listening', () => {
      try { recognition && recognition.stop(); } catch (e) {}
      setTimeout(() => ipcRenderer.invoke('submit-transcript', latestTranscript), 350);
    });

    ipcRenderer.on('play-tts-audio', async (_, { audioBase64, spokenText }) => {
      stopActiveAudio();
      if (audioBase64) {
        try {
          const audio = new Audio('data:audio/mp3;base64,' + audioBase64);
          currentAudioElement = audio;
          audio.onended = () => { currentAudioElement = null; ipcRenderer.send('tts-playback-ended'); };
          audio.onerror = () => { currentAudioElement = null; ipcRenderer.send('tts-playback-ended'); };
          await audio.play();
          return;
        } catch (e) {}
      }
      const utterance = new SpeechSynthesisUtterance(spokenText);
      utterance.onend = () => ipcRenderer.send('tts-playback-ended');
      utterance.onerror = () => ipcRenderer.send('tts-playback-ended');
      speechSynthesis.speak(utterance);
    });

    // =========================================================================
    // 9. ADDITIONAL ENHANCEMENTS: Teaching Pulse Ring & Fake Cursor
    //    These work alongside the existing Clicky system for visual teaching
    // =========================================================================
    
    // Enhanced pulse ring for teaching mode
    ipcRenderer.on('draw-pulse-ring-enhanced', (event, { x, y, label }) => {
      // Don't clear existing drawings - add to them
      const ring = document.createElement('div');
      ring.className = 'pulse-ring-enhanced';
      ring.style.left = (x - 30) + 'px';
      ring.style.top = (y - 30) + 'px';
      ring.style.width = '60px';
      ring.style.height = '60px';
      document.body.appendChild(ring);

      if (label) {
        const tooltip = document.createElement('div');
        tooltip.className = 'tooltip-enhanced';
        tooltip.textContent = label;
        tooltip.style.left = (x + 35) + 'px';
        tooltip.style.top = (y - 10) + 'px';
        document.body.appendChild(tooltip);
        
        // Auto-remove after 3 seconds
        setTimeout(() => {
          ring.remove();
          tooltip.remove();
        }, 3000);
      } else {
        setTimeout(() => ring.remove(), 3000);
      }
    });

    // Enhanced fake cursor (Clicky-style) for teaching mode
    ipcRenderer.on('draw-fake-cursor-enhanced', (event, { x, y, label }) => {
      // Don't clear existing drawings - add to them
      const cursor = document.createElement('div');
      cursor.className = 'fake-cursor-enhanced';
      cursor.style.left = (x - 12) + 'px';
      cursor.style.top = (y - 12) + 'px';
      document.body.appendChild(cursor);

      const arrow = document.createElement('div');
      arrow.className = 'cursor-arrow-enhanced';
      arrow.style.left = (x - 6) + 'px';
      arrow.style.top = (y - 18) + 'px';
      document.body.appendChild(arrow);

      if (label) {
        const tooltip = document.createElement('div');
        tooltip.className = 'tooltip-enhanced';
        tooltip.textContent = label;
        tooltip.style.left = (x + 25) + 'px';
        tooltip.style.top = (y - 10) + 'px';
        document.body.appendChild(tooltip);
        
        setTimeout(() => {
          cursor.remove();
          arrow.remove();
          tooltip.remove();
        }, 2000);
      } else {
        setTimeout(() => {
          cursor.remove();
          arrow.remove();
        }, 2000);
      }
    });

    // Bezier animation for cursor movement
    ipcRenderer.on('animate-cursor-enhanced', (event, { startX, startY, endX, endY, duration }) => {
      const cursor = document.createElement('div');
      cursor.className = 'fake-cursor-enhanced';
      cursor.style.left = (startX - 12) + 'px';
      cursor.style.top = (startY - 12) + 'px';
      document.body.appendChild(cursor);

      const arrow = document.createElement('div');
      arrow.className = 'cursor-arrow-enhanced';
      arrow.style.left = (startX - 6) + 'px';
      arrow.style.top = (startY - 18) + 'px';
      document.body.appendChild(arrow);

      // Animate using Web Animations API with bezier easing
      const animation = cursor.animate([
        { left: (startX - 12) + 'px', top: (startY - 12) + 'px' },
        { left: (endX - 12) + 'px', top: (endY - 12) + 'px' }
      ], {
        duration: duration,
        easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
      });

      const arrowAnimation = arrow.animate([
        { left: (startX - 6) + 'px', top: (startY - 18) + 'px' },
        { left: (endX - 6) + 'px', top: (endY - 18) + 'px' }
      ], {
        duration: duration,
        easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
      });

      animation.onfinish = () => {
        cursor.style.left = (endX - 12) + 'px';
        cursor.style.top = (endY - 12) + 'px';
        arrow.style.left = (endX - 6) + 'px';
        arrow.style.top = (endY - 18) + 'px';
        
        // Auto-remove after animation
        setTimeout(() => {
          cursor.remove();
          arrow.remove();
        }, 500);
      };
    });

    // Clear enhanced drawings only (doesn't affect existing Clicky drawings)
    ipcRenderer.on('clear-enhanced-drawings', () => {
      document.querySelectorAll('.pulse-ring-enhanced, .fake-cursor-enhanced, .cursor-arrow-enhanced, .tooltip-enhanced').forEach(el => el.remove());
    });

    // =========================================================================
    // VIRTUAL CURSOR - Independent operation with color changes
    // =========================================================================
    const virtualCursor = document.getElementById('virtual-cursor');
    const cursorStatus = document.getElementById('cursor-status');

    // Listen for cursor state updates from main process
    ipcRenderer.on('cursor-state', (event, state) => {
      if (!virtualCursor || !cursorStatus) return;

      // Update position
      virtualCursor.style.left = state.position.x + 'px';
      virtualCursor.style.top = state.position.y + 'px';

      // Update color and mode
      if (state.isDetached) {
        virtualCursor.classList.remove('attached');
        virtualCursor.classList.add('detached');
        cursorStatus.classList.remove('attached');
        cursorStatus.classList.add('detached');
        cursorStatus.classList.add('visible');
        cursorStatus.textContent = state.mode === 'teaching' ? 'TEACHING - Independent' : 'EXECUTING - Independent';
      } else {
        virtualCursor.classList.remove('detached');
        virtualCursor.classList.add('attached');
        cursorStatus.classList.remove('detached');
        cursorStatus.classList.add('attached');
        cursorStatus.classList.remove('visible');
        cursorStatus.textContent = 'IDLE - Following Mouse';
      }
    });

    // Follow physical mouse when attached (idle mode)
    document.addEventListener('mousemove', (e) => {
      if (virtualCursor && virtualCursor.classList.contains('attached')) {
        virtualCursor.style.left = e.clientX + 'px';
        virtualCursor.style.top = e.clientY + 'px';
      }
    });
  </script>
</body>
</html>
