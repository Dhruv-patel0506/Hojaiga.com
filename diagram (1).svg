<svg class="dark " xmlns="http://www.w3.org/2000/svg" viewBox="0 0 858.75 1979.5" width="858.75" height="1979.5">
  <style>:root, .light {
    --_lm: ;
    --_dm: initial;
    --bg: #ffffff;
    --fg: #1f1f1f;
    --line: #545454;
    --accent: #1a73e8;
    --surface: #f8f9fa;
    --border: #747775;
  }

  .dark {
    --_lm: initial;
    --_dm: ;
    --bg: #1f1f1f;
    --fg: #e3e3e3;
    --line: #bfbfbf;
    --accent: #8ab4f8;
    --surface: #2d2e30;
    --border: #8e918f;
  }
  @import url('https://fonts.googleapis.com/css2?family=Google+Sans+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Google Sans Mono', sans-serif; }
  svg {
    --_text:          var(--primaryTextColor, var(--fg));
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--lineColor, var(--defaultLinkColor, var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)))));
    --_arrow:         var(--_line);
    --_node-fill:     var(--primaryColor, var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg))));
    --_node-stroke:   var(--primaryBorderColor, var(--nodeBorder, var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)))));
    --_group-fill:    var(--surface, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  var(--_node-stroke);
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }</style>
  <defs>
    <style>text { font-family: "Google Sans Mono", monospace; font-size: 13px; dominant-baseline: central; white-space: pre; }
.outer-box { fill: color-mix(in srgb, var(--fg) 6%, transparent); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.75px; }
.rect-pill { fill: var(--bg); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; }
.stadium-pill { fill: var(--bg); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; }
.hex-pill { fill: var(--bg); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; stroke-linejoin: round; stroke-linecap: round; }
.diamond-box { fill: color-mix(in srgb, var(--fg) 9%, transparent); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; stroke-linejoin: round; stroke-linecap: round; }
.header-text { font-size: 14px; font-weight: 600; fill: var(--_text); }
.label-text { font-size: 13px; font-weight: 500; fill: var(--_text); }
.annotation-text { font-size: 12px; font-weight: 500; fill: var(--_text); }
.arrow-line, .bus-line { stroke: var(--_line); stroke-width: 1.5px; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.divider-line { stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.0px; stroke-opacity: 0.75; }</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="var(--_arrow)"/>
    </marker>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="var(--_arrow)"/>
    </marker>
  </defs>
  <g class="shape outer cluster">
    <rect x="23.5" y="226.5" width="629" height="132" rx="0" ry="0" class="outer-box"/>
    <text x="333.75" y="259.5" class="header-text" text-anchor="middle" dominant-baseline="central">1. SPATIO-TEMPORAL MOTION SLICING ENGINE</text>
    <text x="333.75" y="281.5" class="header-text" text-anchor="middle" dominant-baseline="central">- Processes raw frame bytes using OpenCV absolute pixel deltas</text>
    <text x="333.75" y="303.5" class="header-text" text-anchor="middle" dominant-baseline="central">- Measures rectilinear edge shifts to eliminate talking-head clips</text>
    <text x="333.75" y="325.5" class="header-text" text-anchor="middle" dominant-baseline="central">- Identifies exact frame windows [T0 -&gt; T1] where actions occur</text>
  </g>
  <g class="shape outer cluster">
    <rect x="23.5" y="402.5" width="629" height="132" rx="0" ry="0" class="outer-box"/>
    <text x="333.75" y="435.5" class="header-text" text-anchor="middle" dominant-baseline="central">2. CROSS-MODAL GROUNDING &amp; MASK CORRELATION</text>
    <text x="333.75" y="457.5" class="header-text" text-anchor="middle" dominant-baseline="central">- WhisperX tracks speech and targets word alignment (if available)</text>
    <text x="333.75" y="479.5" class="header-text" text-anchor="middle" dominant-baseline="central">- Grounding DINO converts arbitrary text prompts to raw boxes</text>
    <text x="333.75" y="501.5" class="header-text" text-anchor="middle" dominant-baseline="central">- SAM 2 locks pixel-precise tracking masks over moving UI elements</text>
  </g>
  <g class="shape outer cluster">
    <rect x="23.5" y="578.5" width="629" height="132" rx="0" ry="0" class="outer-box"/>
    <text x="333.75" y="611.5" class="header-text" text-anchor="middle" dominant-baseline="central">3. DE-DUPLICATION MATRIX &amp; MASTER STATE GRAPH CONSOLIDATION</text>
    <text x="333.75" y="633.5" class="header-text" text-anchor="middle" dominant-baseline="central">- Generates localized structural layout fingerprints (Image Hashes)</text>
    <text x="333.75" y="655.5" class="header-text" text-anchor="middle" dominant-baseline="central">- Merges common identical interactions into shared baseline paths</text>
    <text x="333.75" y="677.5" class="header-text" text-anchor="middle" dominant-baseline="central">- Isolates and preserves rare hidden preferences or edge cases</text>
  </g>
  <g class="shape outer cluster">
    <rect x="23.5" y="776.5" width="348.5" height="154" rx="0" ry="0" class="outer-box"/>
    <text x="193.5" y="809.5" class="header-text" text-anchor="middle" dominant-baseline="central">DATASET EXPORT FOR QLORA TRAINING</text>
    <text x="193.5" y="831.5" class="header-text" text-anchor="middle" dominant-baseline="central">- Generates raw screen images</text>
    <text x="193.5" y="853.5" class="header-text" text-anchor="middle" dominant-baseline="central">- Pairs with UI Name Line data</text>
    <text x="193.5" y="875.5" class="header-text" text-anchor="middle" dominant-baseline="central">- Saves directly to harvest/ directory</text>
    <text x="193.5" y="897.5" class="header-text" text-anchor="middle" dominant-baseline="central">- Ready for local train_qlora.py</text>
  </g>
  <g class="shape outer cluster">
    <rect x="23.5" y="1238.5" width="629" height="88" rx="0" ry="0" class="outer-box"/>
    <text x="333.75" y="1271.5" class="header-text" text-anchor="middle" dominant-baseline="central">LAYER 1 &amp; 2: ENTRY POINT &amp; KNOWLEDGE-FIRST REPLAY</text>
    <text x="333.75" y="1293.5" class="header-text" text-anchor="middle" dominant-baseline="central">- Evaluates if a pre-existing plan exists within knowledge_first.py</text>
  </g>
  <g class="shape outer cluster">
    <rect x="23.5" y="1370.5" width="629" height="88" rx="0" ry="0" class="outer-box"/>
    <text x="333.75" y="1403.5" class="header-text" text-anchor="middle" dominant-baseline="central">LAYER 3: AUTONOMY LOOP (Perceive -&gt; Decide -&gt; Act -&gt; Verify)</text>
    <text x="333.75" y="1425.5" class="header-text" text-anchor="middle" dominant-baseline="central">- Core engine driving execution loop. Hits Layer 4 for visual scanning</text>
  </g>
  <g class="shape outer cluster">
    <rect x="23.5" y="1502.5" width="629" height="132" rx="0" ry="0" class="outer-box"/>
    <text x="333.75" y="1535.5" class="header-text" text-anchor="middle" dominant-baseline="central">LAYER 4: SCANNER &amp; PERCEPTION LAYER (WITH VIDEO BRIDGING)</text>
    <text x="333.75" y="1557.5" class="header-text" text-anchor="middle" dominant-baseline="central">- Reads active control tree and deep child-window targets</text>
    <text x="333.75" y="1579.5" class="header-text" text-anchor="middle" dominant-baseline="central">- IF TREE IS EMPTY OR AMBIGUOUS: Falls back to Image Capture</text>
    <text x="333.75" y="1601.5" class="header-text" text-anchor="middle" dominant-baseline="central">- Intercepts state signature and queries Layer 6 via `rag.retrieve`</text>
  </g>
  <g class="shape outer cluster">
    <rect x="23.5" y="1678.5" width="637.5" height="132" rx="0" ry="0" class="outer-box"/>
    <text x="338" y="1711.5" class="header-text" text-anchor="middle" dominant-baseline="central">LAYER 7: TRANSLATED FALLBACK TO WORKFLOW EXECUTOR</text>
    <text x="338" y="1733.5" class="header-text" text-anchor="middle" dominant-baseline="central">- Converts RAG match into the mandatory 6-tuple perception model format:</text>
    <text x="338" y="1755.5" class="header-text" text-anchor="middle" dominant-baseline="central">(id, name, role, bbox, provider_tier, confidence)</text>
    <text x="338" y="1777.5" class="header-text" text-anchor="middle" dominant-baseline="central">- Sets 'provider_tier' to "tier4_offline_video_grounding"</text>
  </g>
  <g class="shape outer cluster">
    <rect x="23.5" y="1854.5" width="629" height="110" rx="0" ry="0" class="outer-box"/>
    <text x="333.75" y="1887.5" class="header-text" text-anchor="middle" dominant-baseline="central">DETECTED INTERACTION ACTUATOR &amp; VERIFIER</text>
    <text x="333.75" y="1909.5" class="header-text" text-anchor="middle" dominant-baseline="central">- Fires pyautogui / Win32 actions to click target bounding boxes</text>
    <text x="333.75" y="1931.5" class="header-text" text-anchor="middle" dominant-baseline="central">- Evaluates post-state image layouts to confirm action success</text>
  </g>
  <g class="shape inner">
    <rect x="25.5" y="95.5" width="132" height="20" rx="3" ry="3" class="rect-pill"/>
    <text x="91.5" y="105.5" class="label-text" text-anchor="middle" dominant-baseline="central">Raw Video Pool</text>
  </g>
  <g class="shape inner">
    <rect x="195.5" y="95.5" width="455" height="20" rx="10" ry="10" class="stadium-pill"/>
    <text x="423" y="105.5" class="label-text" text-anchor="middle" dominant-baseline="central">Can be any language: English, German, Japanese, etc.</text>
  </g>
  <g class="shape inner">
    <rect x="25.5" y="1173.5" width="157.5" height="20" rx="3" ry="3" class="rect-pill"/>
    <text x="104.25" y="1183.5" class="label-text" text-anchor="middle" dominant-baseline="central">User Intent Input</text>
  </g>
  <line x1="19.25" y1="15" x2="843.75" y2="15" class="bus-line"/>
  <line x1="19.25" y1="20" x2="843.75" y2="20" class="bus-line"/>
  <line x1="576" y1="39.5" x2="591" y2="39.5" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="19.25" y1="59" x2="843.75" y2="59" class="bus-line"/>
  <line x1="19.25" y1="64" x2="843.75" y2="64" class="bus-line"/>
  <line x1="157.5" y1="105.5" x2="193.5" y2="105.5" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="36.25" y1="127.5" x2="53.25" y2="127.5" class="bus-line"/>
  <line x1="36.25" y1="149.5" x2="53.25" y2="149.5" class="bus-line"/>
  <line x1="36.25" y1="171.5" x2="53.25" y2="171.5" class="bus-line"/>
  <line x1="95.75" y1="743.5" x2="554.75" y2="743.5" class="bus-line"/>
  <line x1="372" y1="787.5" x2="758.75" y2="787.5" class="bus-line"/>
  <line x1="372" y1="919.5" x2="758.75" y2="919.5" class="bus-line"/>
  <line x1="486.75" y1="983" x2="699.25" y2="983" class="bus-line"/>
  <line x1="486.75" y1="988" x2="699.25" y2="988" class="bus-line"/>
  <line x1="486.75" y1="1049" x2="699.25" y2="1049" class="bus-line"/>
  <line x1="486.75" y1="1054" x2="699.25" y2="1054" class="bus-line"/>
  <line x1="19.25" y1="1093" x2="843.75" y2="1093" class="bus-line"/>
  <line x1="19.25" y1="1098" x2="843.75" y2="1098" class="bus-line"/>
  <line x1="593" y1="1117.5" x2="608" y2="1117.5" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="19.25" y1="1137" x2="843.75" y2="1137" class="bus-line"/>
  <line x1="19.25" y1="1142" x2="843.75" y2="1142" class="bus-line"/>
  <line x1="36.25" y1="115.5" x2="36.25" y2="171.5" class="bus-line"/>
  <line x1="95.75" y1="171.5" x2="95.75" y2="224.5" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="95.75" y1="743.5" x2="95.75" y2="774.5" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="95.75" y1="1193.5" x2="95.75" y2="1236.5" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="338" y1="358.5" x2="338" y2="400.5" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="338" y1="534.5" x2="338" y2="576.5" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="325.25" y1="710.5" x2="325.25" y2="743.5" class="bus-line"/>
  <line x1="338" y1="1326.5" x2="338" y2="1368.5" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="338" y1="1458.5" x2="338" y2="1500.5" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="325.25" y1="1634.5" x2="325.25" y2="1676.5" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="325.25" y1="1810.5" x2="325.25" y2="1852.5" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="427.25" y1="787.5" x2="427.25" y2="919.5" class="bus-line"/>
  <line x1="554.75" y1="743.5" x2="554.75" y2="785.5" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="588.75" y1="919.5" x2="588.75" y2="983.5" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="758.75" y1="787.5" x2="758.75" y2="853.5" class="bus-line"/>
  <line x1="758.75" y1="897.5" x2="758.75" y2="919.5" class="bus-line"/>
  <text x="15" y="39.5" class="annotation-text" text-anchor="start" dominant-baseline="central">PHASE 1: OFFLINE MULTI-VIDEO HARVESTING &amp; DE-DUPLICATION (Layer 8</text>
  <text x="601.5" y="39.5" class="annotation-text" text-anchor="start" dominant-baseline="central">Layer 6)</text>
  <text x="66" y="127.5" class="annotation-text" text-anchor="start" dominant-baseline="central">Video 1 (2-Hour Advanced Tutorial)</text>
  <text x="66" y="149.5" class="annotation-text" text-anchor="start" dominant-baseline="central">Video 2 (1-Hour Beginner Guide)</text>
  <text x="66" y="171.5" class="annotation-text" text-anchor="start" dominant-baseline="central">Video 3 (30-Minute Speed-Run Workflow)</text>
  <text x="440" y="809.5" class="annotation-text" text-anchor="start" dominant-baseline="central">KNOWLEDGE INGESTION (VIA OBSERVATION)</text>
  <text x="440" y="831.5" class="annotation-text" text-anchor="start" dominant-baseline="central">- Formats unique UI states into the</text>
  <text x="457" y="853.5" class="annotation-text" text-anchor="start" dominant-baseline="central">exact 6-tuple coordinate format</text>
  <text x="448.5" y="875.5" class="annotation-text" text-anchor="start" dominant-baseline="central">- Injects into database using standard</text>
  <text x="457" y="897.5" class="annotation-text" text-anchor="start" dominant-baseline="central">`rag.observe` payload schema</text>
  <text x="482.5" y="1007.5" class="annotation-text" text-anchor="start" dominant-baseline="central">HOJAIGA MASTER RAG VAULT</text>
  <text x="482.5" y="1029.5" class="annotation-text" text-anchor="start" dominant-baseline="central">(Layer 6: SSD / Host RAM)</text>
  <text x="15" y="1117.5" class="annotation-text" text-anchor="start" dominant-baseline="central">PHASE 2: LIVE ONLINE RUNTIME DETERMINISTIC EXECUTION LOOP (Layers 1</text>
  <text x="618.5" y="1117.5" class="annotation-text" text-anchor="start" dominant-baseline="central">7)</text>
  <text x="193.5" y="1183.5" class="annotation-text" text-anchor="start" dominant-baseline="central">(e.g., "Open melody editor and draw a kick drum pattern")</text>
</svg>
