<svg class="dark " xmlns="http://www.w3.org/2000/svg" viewBox="0 0 614.55 358" width="614.55" height="358">
  <style>:root, .light {
    --_lm: ;
    --_dm: initial;
    --bg: #ffffff;
    --fg: #1f1f1f;
    --line: #545454;
    --accent: #1a73e8;
    --surface: #f8f9fa;
    --border: #747775;
  }

  .dark {
    --_lm: initial;
    --_dm: ;
    --bg: #1f1f1f;
    --fg: #e3e3e3;
    --line: #bfbfbf;
    --accent: #8ab4f8;
    --surface: #2d2e30;
    --border: #8e918f;
  }
  @import url('https://fonts.googleapis.com/css2?family=Google+Sans+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Google Sans Mono', sans-serif; }
  svg {
    --_text:          var(--primaryTextColor, var(--fg));
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--lineColor, var(--defaultLinkColor, var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)))));
    --_arrow:         var(--_line);
    --_node-fill:     var(--primaryColor, var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg))));
    --_node-stroke:   var(--primaryBorderColor, var(--nodeBorder, var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)))));
    --_group-fill:    var(--surface, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  var(--_node-stroke);
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }</style>
  <defs>
    <style>text { font-family: "Google Sans Mono", monospace; font-size: 13px; dominant-baseline: central; white-space: pre; }
.outer-box { fill: color-mix(in srgb, var(--fg) 6%, transparent); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.75px; }
.rect-pill { fill: var(--bg); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; }
.stadium-pill { fill: var(--bg); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; }
.hex-pill { fill: var(--bg); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; stroke-linejoin: round; stroke-linecap: round; }
.diamond-box { fill: color-mix(in srgb, var(--fg) 9%, transparent); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; stroke-linejoin: round; stroke-linecap: round; }
.header-text { font-size: 14px; font-weight: 600; fill: var(--_text); }
.label-text { font-size: 13px; font-weight: 500; fill: var(--_text); }
.annotation-text { font-size: 12px; font-weight: 500; fill: var(--_text); }
.arrow-line, .bus-line { stroke: var(--_line); stroke-width: 1.5px; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.divider-line { stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.0px; stroke-opacity: 0.75; }</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="var(--_arrow)"/>
    </marker>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="var(--_arrow)"/>
    </marker>
  </defs>
  <g class="shape inner">
    <rect x="15" y="15" width="90.2" height="20" rx="3" ry="3" class="rect-pill"/>
    <text x="60.1" y="25" class="label-text" text-anchor="middle" dominant-baseline="central">Raw Video</text>
  </g>
  <g class="shape inner">
    <rect x="166.3" y="125" width="246.6" height="20" rx="10" ry="10" class="stadium-pill"/>
    <text x="289.6" y="135" class="label-text" text-anchor="middle" dominant-baseline="central">Detect "apple" bounding box</text>
  </g>
  <g class="shape inner">
    <rect x="117.35" y="191" width="404" height="20" rx="10" ry="10" class="stadium-pill"/>
    <text x="319.35" y="201" class="label-text" text-anchor="middle" dominant-baseline="central">Confidence Score: Visual Object == Spoken Word</text>
  </g>
  <g class="shape inner">
    <rect x="166.65" y="257" width="254.4" height="20" rx="10" ry="10" class="stadium-pill"/>
    <text x="293.85" y="267" class="label-text" text-anchor="middle" dominant-baseline="central">Produce Multimodal Embedding</text>
  </g>
  <line x1="43.1" y1="47" x2="60.1" y2="47" class="bus-line"/>
  <line x1="183.35" y1="47" x2="206.85" y2="47" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="43.1" y1="69" x2="60.1" y2="69" class="bus-line"/>
  <line x1="183.35" y1="69" x2="206.85" y2="69" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="43.1" y1="35" x2="43.1" y2="69" class="bus-line"/>
  <line x1="272.6" y1="91" x2="272.6" y2="105.6" class="bus-line"/>
  <line x1="272.6" y1="120.4" x2="272.6" y2="125" class="bus-line"/>
  <line x1="272.6" y1="145" x2="272.6" y2="171.6" class="bus-line"/>
  <line x1="272.6" y1="186.4" x2="272.6" y2="191" class="bus-line"/>
  <line x1="272.6" y1="277" x2="272.6" y2="289" class="bus-line"/>
  <line x1="281.1" y1="211" x2="281.1" y2="237.6" class="bus-line"/>
  <line x1="281.1" y1="252.4" x2="281.1" y2="257" class="bus-line"/>
  <text x="72.85" y="47" class="annotation-text" text-anchor="start" dominant-baseline="central">Audio Stream</text>
  <text x="217.35" y="47" class="annotation-text" text-anchor="start" dominant-baseline="central">WhisperX (Word-level timestamps: "apple" @ 00:14)</text>
  <text x="72.85" y="69" class="annotation-text" text-anchor="start" dominant-baseline="central">Frame Stream</text>
  <text x="217.35" y="69" class="annotation-text" text-anchor="start" dominant-baseline="central">Extract frame at timestamp 00:14</text>
  <text x="217.35" y="113" class="annotation-text" text-anchor="start" dominant-baseline="central">Grounding DINO / SAM 2</text>
  <text x="183.35" y="179" class="annotation-text" text-anchor="start" dominant-baseline="central">Cross-Modal Verification</text>
  <text x="200.35" y="245" class="annotation-text" text-anchor="start" dominant-baseline="central">OpenCLIP / ImageBind</text>
  <text x="191.85" y="311" class="annotation-text" text-anchor="start" dominant-baseline="central">Vector DB (Qdrant / Milvus)</text>
  <text x="140.85" y="333" class="annotation-text" text-anchor="start" dominant-baseline="central">(Search &amp; Temporal Retrieval Queries)</text>
</svg>
