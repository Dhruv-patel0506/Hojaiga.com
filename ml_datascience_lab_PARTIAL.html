<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machine Learning with Python: Live Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=IBM+Plex+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* ===== tokens (same family as the cross-product example) ===== */
:root{
  --bg:#F4F6F2;--surface:#FFFFFF;--fg:#1D2421;--muted:#5E6A64;--line:#D6DDD8;
  --paper:#FFFEF7;--rule:#DCE6F2;--margin:#F2B8B8;
  --down:#1C6ED0;--down-soft:#DCEAFB;--up:#D2600F;--up-soft:#FCE6D5;
  --ok:#1E8E5A;--ok-soft:#DDF3E8;--bad:#C8323C;--bad-soft:#FBE1E3;
  --c0:#1C6ED0;--c1:#D2600F;--c2:#1E8E5A;--c3:#7A4FD0;--c4:#0E8FA3;--c5:#B8860B;
  --c0s:#DCEAFB;--c1s:#FCE6D5;--c2s:#DDF3E8;--c3s:#E9E0FA;--c4s:#D6F0F4;--c5s:#F7ECC8;
  --ax:#8A958F;--gr:#E6EBE7;--soft:#EEF2EF;
  --term-bg:#12161D;--term-fg:#E3E9F0;--term-dim:#8A96A6;--term-key:#7FB8FF;--term-str:#9BE29B;--term-warn:#F5C542;--term-err:#FF7B7B;--term-fn:#E8C77D;--term-num:#F5A97F;
  --f-hand:"Kalam","Comic Sans MS",cursive;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111613;--surface:#1A201D;--fg:#E6ECE8;--muted:#9DABA4;--line:#2E3833;
  --paper:#1E2420;--rule:#2A3540;--margin:#5A2E2E;
  --down:#6BA8F5;--down-soft:#1A2C45;--up:#F59A5A;--up-soft:#3D2616;
  --ok:#4CC38A;--ok-soft:#12301F;--bad:#F06A6A;--bad-soft:#3A1A1D;
  --c0:#6BA8F5;--c1:#F59A5A;--c2:#4CC38A;--c3:#B397F5;--c4:#4FC3D6;--c5:#E0B84A;
  --c0s:#1A2C45;--c1s:#3D2616;--c2s:#12301F;--c3s:#2A2145;--c4s:#10303A;--c5s:#3A3012;
  --ax:#7B8882;--gr:#26302B;--soft:#222A26;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613;--surface:#1A201D;--fg:#E6ECE8;--muted:#9DABA4;--line:#2E3833;
  --paper:#1E2420;--rule:#2A3540;--margin:#5A2E2E;
  --down:#6BA8F5;--down-soft:#1A2C45;--up:#F59A5A;--up-soft:#3D2616;
  --ok:#4CC38A;--ok-soft:#12301F;--bad:#F06A6A;--bad-soft:#3A1A1D;
  --c0:#6BA8F5;--c1:#F59A5A;--c2:#4CC38A;--c3:#B397F5;--c4:#4FC3D6;--c5:#E0B84A;
  --c0s:#1A2C45;--c1s:#3D2616;--c2s:#12301F;--c3s:#2A2145;--c4s:#10303A;--c5s:#3A3012;
  --ax:#7B8882;--gr:#26302B;--soft:#222A26;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
[hidden]{display:none!important}
button,input,select{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--down);outline-offset:2px}

.wrap{max-width:1240px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px));display:grid;gap:18px}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
h1{margin:0;font:700 clamp(1.6rem,4.6vw,2.4rem) var(--f-body);letter-spacing:-.02em;text-wrap:balance}
h1 span{font-family:var(--f-hand);color:var(--down)}
.sub{margin:4px 0 0;color:var(--muted);font-size:15px;max-width:70ch}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 12px;cursor:pointer;font:600 14px var(--f-body)}

/* ===== navigation ===== */
.nav{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ng{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ng b{font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-width:120px}
.pill{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:4px 12px;font:600 13.5px var(--f-body);cursor:pointer}
.pill[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill.seen::after{content:" ✓";color:var(--ok);font-weight:700}
.pill[aria-current="true"].seen::after{color:var(--bg)}
@media (max-width:640px){.ng b{min-width:100%}}

/* ===== lesson header & concept ===== */
.lh h2{margin:0;font:700 clamp(1.4rem,3.4vw,1.9rem) var(--f-body);letter-spacing:-.01em}
.lh h2 span{font-family:var(--f-hand);color:var(--down);font-weight:700}
.lh .goal{margin:4px 0 0;color:var(--muted);max-width:80ch}
.concept{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0}
.concept>summary{cursor:pointer;padding:12px 18px;font:700 13px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;list-style:none}
.concept>summary::before{content:"▸ ";color:var(--down)}
.concept[open]>summary::before{content:"▾ "}
.concept .cbody{padding:0 18px 16px;display:grid;gap:10px}
.concept p{margin:0}
.concept ul{margin:0;padding-left:20px;display:grid;gap:3px}
.concept .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.concept .two{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:2px 9px;font:500 13px var(--f-mono)}
.callout{border-left:4px solid var(--down);background:var(--down-soft);padding:8px 12px;border-radius:8px}
.callout.warn{border-color:var(--up);background:var(--up-soft)}
.callout.ok{border-color:var(--ok);background:var(--ok-soft)}
code{font-family:var(--f-mono);font-size:.9em;background:var(--soft);padding:1px 5px;border-radius:5px}

/* ===== params ===== */
.params{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.params:empty{display:none}
.params label{display:flex;align-items:center;gap:8px;font:600 13px var(--f-mono);color:var(--muted)}
.params .val{color:var(--fg);min-width:2.6em;display:inline-block}
.params input[type=range]{width:150px;accent-color:var(--down)}
.params input[type=number],.params input[type=text],.params select{font:600 14px var(--f-mono);padding:5px 7px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.params input[type=number]{width:4.8em;text-align:center}
.params input[type=text]{width:16em}
.params button{font:700 13px var(--f-body);padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}

/* ===== player ===== */
.player{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:18px;align-items:start}
.player>*{min-width:0}
.colL{display:grid;gap:18px}
@media (max-width:900px){.player{grid-template-columns:minmax(0,1fr)}}
.card{border-radius:16px;border:1px solid var(--line);overflow:hidden;background:var(--surface)}
.card>h3{margin:0;font:700 12.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:11px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.card>h3 em{font:600 12px var(--f-body);letter-spacing:0;text-transform:none;font-style:normal;color:var(--muted);text-align:right}
.vizbox{padding:8px 10px 12px;min-height:300px;display:grid;align-items:center}
.vizbox .ph{color:var(--muted);text-align:center;padding:40px 10px}
.vsvg{width:100%;height:auto;max-height:440px;display:block;overflow:visible}
.vsvg text{font-family:var(--f-body);fill:var(--fg);font-size:12px}
.vsvg .tk{font-size:11px;fill:var(--muted)}
.vsvg .al{font-size:12px;fill:var(--muted);font-weight:600}
.vsvg .hand{font-family:var(--f-hand);font-weight:700;font-size:16px}
.vsvg .mono{font-family:var(--f-mono);font-size:11.5px}
.vsvg .b{font-weight:700}
.vsvg .m{fill:var(--muted)}
.vsvg .sm{font-size:10.5px}
.vsvg .lg{font-size:15px}
.vtable{width:100%;border-collapse:separate;border-spacing:0;font:500 14px var(--f-mono);margin:4px 0}
.vtable th,.vtable td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:right;transition:background .3s,opacity .3s}
.vtable th{font-weight:700;color:var(--muted);background:var(--soft);position:sticky;top:0}
.vtable td:first-child,.vtable th:first-child{color:var(--muted);text-align:left}
.vtable .hl0{background:var(--c0s);color:var(--c0);font-weight:700}
.vtable .hl1{background:var(--c1s);color:var(--c1);font-weight:700}
.vtable .hl2{background:var(--c2s);color:var(--c2);font-weight:700}
.vtable .hl3{background:var(--c3s);color:var(--c3);font-weight:700}
.vtable .dim{opacity:.35}
.vtable .nan{color:var(--bad);font-weight:700}

/* school notebook */
.school{background:var(--paper)}
.school>h3{background:var(--surface)}
.nb{position:relative;max-height:380px;overflow:auto;padding:0 16px 8px 50px;
  background:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);background-attachment:local;background-color:var(--paper)}
.school .marg{position:relative}
.school .marg::before{content:"";position:absolute;left:34px;top:0;bottom:0;width:2px;background:var(--margin);z-index:1;pointer-events:none}
.nbk{padding-top:0}
.nb-t{font:700 19px/32px var(--f-hand);color:var(--down)}
.ln{font:400 18px/32px var(--f-hand);white-space:pre-wrap}
.ln.nw{white-space:nowrap;overflow-x:auto;overflow-y:hidden}
.ln.dimmed{color:var(--muted)}
.nbk.old .ln{opacity:.78}
.nbk.new .ln,.nbk.new .nb-t{animation:write .6s ease-out both}
@keyframes write{from{opacity:0;transform:translateX(-8px)}}
.ln .d{color:var(--down);font-weight:700}.ln .u{color:var(--up);font-weight:700}
.ln .r{background:var(--ok-soft);color:var(--ok);font-weight:700;padding:0 6px;border-radius:6px}
.ln .no{color:var(--bad);font-weight:700}
.ln .g{color:var(--muted)}
.ln .p{color:var(--c3);font-weight:700}
.ln sub,.ln sup{font-size:.7em;line-height:0}
.nb .empty{color:var(--muted);font:400 17px/32px var(--f-hand)}

/* python terminal */
.np{background:var(--term-bg);color:var(--term-fg);border-color:var(--term-bg)}
.np>h3{color:var(--term-dim);border-color:#262D38}
.np>h3 .dots3{display:inline-flex;gap:5px;margin-right:8px}
.np>h3 .dots3 i{width:10px;height:10px;border-radius:50%;background:#3A4350;display:inline-block}
.term{max-height:640px;overflow:auto;padding:10px 14px 16px}
.term .empty{color:var(--term-dim);font:13.5px var(--f-mono);padding:6px 4px}
.tcell{margin:0 0 14px}
.tcell .in{display:block}
.tcell .pr{display:block;color:var(--term-dim);font:11.5px/1.3 var(--f-mono);user-select:none;margin-bottom:3px}
.tcell pre{margin:0;font:12.5px/1.65 var(--f-mono);white-space:pre;overflow-x:auto;flex:1;min-width:0;color:var(--term-fg)}
.tcell .out{margin:6px 0 0 0;padding:8px 12px;background:#0B0E13;border-left:3px solid #3A4556;border-radius:0 8px 8px 0;font:12.5px/1.55 var(--f-mono);white-space:pre;overflow-x:auto;color:var(--term-fg)}
.tcell .out .w{color:var(--term-warn)}.tcell .out .e{color:var(--term-err)}.tcell .out .c{color:var(--term-dim)}
.tcell.cur{animation:pop .35s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.k{color:var(--term-key)}.f{color:var(--term-fn)}.s{color:var(--term-str)}.n{color:var(--term-num)}.c{color:var(--term-dim);font-style:italic}
.caret{display:inline-block;width:.55em;height:1.1em;vertical-align:-.2em;background:var(--term-fg);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls button,.controls select{font:700 15px var(--f-body);padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.controls select{padding:9px 10px;font-weight:600}
.controls button.primary{background:var(--down);border-color:var(--down);color:var(--surface);min-width:6.5em}
.controls button:disabled{opacity:.4;cursor:default}
.controls .where{margin-left:auto;color:var(--muted);font-size:14px}
.dots{display:flex;gap:5px;flex-wrap:wrap;width:100%}
.dots button{width:14px;height:14px;padding:0;border-radius:50%;border:2px solid var(--line);background:var(--surface);min-width:0}
.dots button.on{background:var(--down);border-color:var(--down)}
.dots button.cur{outline:3px solid var(--down-soft);transform:scale(1.2)}
@media (max-width:600px){.controls .where{margin-left:0;width:100%}}

/* lower sections */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0}
.sec>summary{cursor:pointer;padding:12px 18px;font:700 13px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;list-style:none}
.sec>summary::before{content:"▸ ";color:var(--down)}
.sec[open]>summary::before{content:"▾ "}
.sec .sbody{padding:0 18px 16px}
.cheat{width:100%;border-collapse:collapse;font-size:14px}
.cheat td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
.cheat td:first-child{font-family:var(--f-mono);font-size:13px;color:var(--c0);white-space:pre-wrap;word-break:break-word;width:46%}
.pit{margin:0;padding-left:20px;display:grid;gap:5px}
.lnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lnav button{font:700 14px var(--f-body);padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}

/* quiz */
.qwrap{display:grid;gap:12px}
.qbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.qbar button,.qbar select{font:700 14px var(--f-body);padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.qbar button.primary{background:var(--down);border-color:var(--down);color:var(--surface)}
.qscore{font:700 14px var(--f-mono);color:var(--muted)}
.qtopics{display:flex;flex-wrap:wrap;gap:6px}
.qtopics label{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.q{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.q .qt{font-weight:600}
.q .qt code{font-weight:500}
.q .opts{display:grid;gap:6px}
.opt{text-align:left;font:500 15px var(--f-body);padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--down)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--fg)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.why{font-size:14.5px;background:var(--soft);border-radius:10px;padding:8px 12px}
.why .ok{color:var(--ok);font-weight:700}.why .bad{color:var(--bad);font-weight:700}
.tag{font:600 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.flipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.flip{perspective:900px;min-height:170px;cursor:pointer}
.flip .fi{position:relative;width:100%;height:100%;min-height:170px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:6px;justify-content:center}
.flip .fa{background:var(--surface)}
.flip .fb{background:var(--ok-soft);transform:rotateY(180deg);font-size:14.5px}
.flip .fa b{font-size:15.5px}

@media (prefers-reduced-motion:reduce){.nbk.new .ln,.nbk.new .nb-t,.tcell.cur,.caret{animation:none!important}.flip .fi{transition:none}html{scroll-behavior:auto}}

</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Machine Learning with Python <span>live lab</span></h1>
      <p class="sub">Every lesson is a small animated classroom: the picture is drawn step by step, the notebook shows the working by hand, and the Python terminal types and runs the real code. Change the sliders and everything recomputes.</p>
    </div>
    <button type="button" id="theme" class="iconbtn">Dark / light</button>
  </div>
  <nav class="nav" id="nav" aria-label="Lessons"></nav>
  <main id="lesson" style="display:grid;gap:18px"></main>
</div>
<script>
'use strict';
/* =====================================================================
   CORE HELPERS  (shared by every lesson)
   ---------------------------------------------------------------------
   Lesson author cheat-sheet
   - $, $$, esc, clamp, lerp, ease, seg(t,a,b)       small utilities
   - RNG(seed) -> r() uniform, r.int(lo,hi), r.norm(mu,sd), r.pick, r.shuffle
   - sum, mean, variance, std, median, quantile      numpy-compatible stats
   - nf(x,d) notebook number (pretty minus)   pf(x,d) python number (ASCII minus)
   - npA(array,{dtype})   prints a 1D/2D array exactly like numpy
   - dfs(cols,{index})    prints a DataFrame exactly like pandas
   - sers(idx,vals,name,dtype)  prints a Series like pandas
   - svg(W,H,inner), Chart({...}), P.c/P.l/P.t/P.r/P.p primitives, C[] colours
   - lstsq, solve, inv, mm, T                        small linear algebra
   - normPdf, normCdf, erf
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);       // progress of a sub-phase a..b inside t
const range = n => Array.from({ length: n }, (_, i) => i);
const sum = a => a.reduce((s, x) => s + x, 0);
const mean = a => sum(a) / a.length;
const variance = (a, dd = 0) => { const m = mean(a); return sum(a.map(x => (x - m) ** 2)) / (a.length - dd); };
const std = (a, dd = 0) => Math.sqrt(variance(a, dd));
const median = a => { const s = [...a].sort((x, y) => x - y), n = s.length; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; };
const quantile = (a, q) => { const s = [...a].sort((x, y) => x - y), p = (s.length - 1) * q, i = Math.floor(p), f = p - i; return i + 1 < s.length ? s[i] + (s[i + 1] - s[i]) * f : s[i]; };
const argmax = a => a.indexOf(Math.max(...a));
const argmin = a => a.indexOf(Math.min(...a));
const uniq = a => [...new Set(a)];
const zip = (...as) => as[0].map((_, i) => as.map(a => a[i]));
const dist = (a, b) => Math.hypot(...a.map((v, i) => v - b[i]));

/* ---------- seeded random ---------- */
function RNG(seed) {
  let a = (seed >>> 0) || 1;
  const f = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  f.int = (lo, hi) => lo + Math.floor(f() * (hi - lo + 1));
  f.norm = (mu = 0, s = 1) => { let u = 0; while (!u) u = f(); const v = f(); return mu + s * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  f.pick = arr => arr[Math.floor(f() * arr.length)];
  f.shuffle = arr => { arr = [...arr]; for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };

/* =====================================================================
   QUIZ ENGINE  -- generators build a fresh, computed question every time
   Quiz.add(tags, r => ({ text, correct, wrong:[...], why }))
   ===================================================================== */
const Quiz = {
  gens: [], seen: new Set(), labels: {},
  add(tags, gen) { this.gens.push({ tags: [].concat(tags), gen }); },
  label(tag, name) { this.labels[tag] = name; },
  topics() { return uniq(this.gens.flatMap(g => g.tags)); },
  options(q, r) {
    const c = String(q.correct), wrong = uniq(q.wrong.map(String)).filter(w => w !== c);
    if (wrong.length < 2) return null;
    const picked = r.shuffle(wrong).slice(0, 3), all = r.shuffle([c, ...picked]);
    return { opts: all, ans: all.indexOf(c) };
  },
  make(tags, n) {
    let pool = this.gens.filter(g => !tags || !tags.length || g.tags.some(t => tags.includes(t)));
    if (!pool.length) pool = this.gens;
    const out = []; let order = [], guard = 0;
    const fresh = () => RNG((Math.random() * 4294967296) >>> 0);
    while (out.length < n && guard++ < n * 60) {
      if (!order.length) order = fresh().shuffle(pool);
      const g = order.pop(), r = fresh();
      let q; try { q = g.gen(r); } catch (e) { console.error('quiz generator failed', e); continue; }
      if (!q || (this.seen.has(q.text) && guard < n * 40)) continue;
      const o = this.options(q, r); if (!o) continue;
      this.seen.add(q.text); out.push({ text: q.text, ...o, why: q.why || '', tag: g.tags[0] });
    }
    return out;
  },
  /* renders questions into el; returns controller */
  mount(el, o) {
    const { tags, n = 5, compact = false } = o;
    const ctl = { score: 0, done: 0, total: 0, byTag: {}, onChange: o.onChange };
    const draw = () => {
      const qs = this.make(tags, n); ctl.score = 0; ctl.done = 0; ctl.total = qs.length; ctl.byTag = {};
      el.innerHTML = '';
      const list = document.createElement('div'); list.className = 'qwrap';
      qs.forEach((q, qi) => {
        const d = document.createElement('div'); d.className = 'q';
        d.innerHTML = `<div class="tag">${esc(this.labels[q.tag] || q.tag)}</div><div class="qt">${qi + 1}. ${q.text}</div><div class="opts"></div><div class="why" hidden></div>`;
        const ob = $('.opts', d), why = $('.why', d);
        q.opts.forEach((txt, oi) => {
          const b = document.createElement('button'); b.type = 'button'; b.className = 'opt'; b.innerHTML = txt;
          b.onclick = () => {
            $$('.opt', d).forEach(x => (x.disabled = true));
            const good = oi === q.ans; ctl.done++; if (good) ctl.score++;
            ctl.byTag[q.tag] = ctl.byTag[q.tag] || [0, 0]; ctl.byTag[q.tag][1]++; if (good) ctl.byTag[q.tag][0]++;
            b.classList.add(good ? 'ok' : 'bad'); if (!good) $$('.opt', d)[q.ans].classList.add('ok');
            why.hidden = false; why.innerHTML = `<span class="${good ? 'ok' : 'bad'}">${good ? 'Correct.' : 'Not quite.'}</span> ${q.why}`;
            if (ctl.onChange) ctl.onChange(ctl);
          };
          ob.appendChild(b);
        });
        list.appendChild(d);
      });
      el.appendChild(list);
      if (compact) {
        const more = document.createElement('button'); more.type = 'button'; more.className = 'iconbtn'; more.textContent = '↻ Another set'; more.style.marginTop = '10px'; more.onclick = draw; el.appendChild(more);
      }
      if (ctl.onChange) ctl.onChange(ctl);
    };
    ctl.redraw = draw; draw(); return ctl;
  },
  page(el) {
    const tags = this.topics();
    el.innerHTML = `
      <div class="lh"><h2>Final quiz <span>never the same twice</span></h2>
      <p class="goal">Every question is generated from fresh random numbers, the answer is computed by the same formula the lesson teaches, and the wrong options are the classic mistakes (forgetting the square root, dividing by n instead of n&minus;1, swapping precision and recall...). Options are shuffled each time, so memorising a position or a value is useless.</p></div>
      <div class="qwrap">
        <div class="qtopics">${tags.map(t => `<label><input type="checkbox" value="${t}" checked> ${esc(this.labels[t] || t)}</label>`).join('')}</div>
        <div class="qbar">
          <select class="qn" aria-label="Number of questions"><option>5</option><option selected>10</option><option>15</option><option>20</option></select>
          <button type="button" class="primary qgo">New questions</button>
          <button type="button" class="qall">All topics</button><button type="button" class="qnone">None</button>
          <span class="qscore"></span>
        </div>
        <div class="qres"></div>
        <div class="qbox"></div>
      </div>`;
    const box = $('.qbox', el), sc = $('.qscore', el), res = $('.qres', el);
    const go = () => {
      const t = $$('.qtopics input:checked', el).map(i => i.value);
      res.innerHTML = '';
      this.mount(box, {
        tags: t.length ? t : tags, n: +$('.qn', el).value,
        onChange: c => {
          sc.textContent = `Score ${c.score} / ${c.done} answered of ${c.total}  ·  ${this.seen.size} different questions seen this session`;
          if (c.total && c.done === c.total) {
            const weak = Object.entries(c.byTag).filter(([, v]) => v[0] < v[1]).map(([k]) => this.labels[k] || k);
            res.innerHTML = `<div class="callout ${c.score === c.total ? 'ok' : ''}"><b>Finished: ${c.score} / ${c.total}.</b> ${weak.length ? 'Revisit: ' + weak.join(', ') + '.' : 'Every topic was right. Press &ldquo;New questions&rdquo; for a different set.'}</div>`;
          }
        },
      });
    };
    $('.qgo', el).onclick = go;
    $('.qall', el).onclick = () => $$('.qtopics input', el).forEach(i => (i.checked = true));
    $('.qnone', el).onclick = () => $$('.qtopics input', el).forEach(i => (i.checked = false));
    go();
  },
};

(function () {
  const GN = ['CS', 'EE', 'ME'];
  const pearson = (a, b) => { const ma = mean(a), mb = mean(b); return sum(a.map((v, i) => (v - ma) * (b[i] - mb))) / Math.sqrt(sum(a.map(v => (v - ma) ** 2)) * sum(b.map(v => (v - mb) ** 2))); };
  const arrS = (a, d = 1) => `np.array([${a.map(v => v.toFixed(d)).join(', ')}])`;
  const pyL = (a, d = 1) => '[' + a.map(v => v.toFixed(d)).join(', ') + ']';
  function heat(v) { // -1..1 -> colour
    const a = Math.abs(v), t = Math.round(235 - 150 * a);
    return v >= 0 ? `rgb(${t},${Math.round(235 - 110 * a)},255)`.replace(/^rgb\((\d+),(\d+),255\)$/, (m, r, g) => `rgb(${235 - Math.round(150 * a)},${235 - Math.round(95 * a)},${255 - Math.round(20 * a)})`)
      : `rgb(${255 - Math.round(20 * a)},${235 - Math.round(95 * a)},${235 - Math.round(150 * a)})`;
  }
  function make(p) {
    const r = RNG(p.seed), n = p.n;
    const x = range(n).map(() => round(1 + r() * 8, 1)).sort((a, b) => a - b);
    const g = x.map(() => r.int(0, 2));
    const y = x.map((v, i) => round(36 + 4.5 * v + [0, 6, -5][g[i]] + r.norm(0, 4), 1));
    const wk = range(8).map(i => round(58 + 3 * i + r.norm(0, 3), 1));
    const r2 = RNG(p.seed + 99), H = [], S = [], Sc = [], Mk = [];
    for (let i = 0; i < 10; i++) { const h = round(1 + r2() * 8, 1); H.push(h); S.push(round(8 - 0.3 * h + r2.norm(0, .8), 1)); Sc.push(round(5 - 0.4 * h + r2.norm(0, 1), 1)); }
    H.forEach((h, i) => Mk.push(round(40 + 5 * h + 2 * S[i] - 1.5 * Sc[i] + r2.norm(0, 3), 1)));
    return { x, g, y, wk, H, S, Sc, Mk, n };
  }
  function histo(v, B) {
    const lo = Math.min(...v), hi = Math.max(...v), edges = range(B + 1).map(i => lo + (hi - lo) * i / B), counts = Array(B).fill(0);
    v.forEach(a => { counts[Math.min(B - 1, Math.floor((a - lo) / (hi - lo) * B))]++; });
    return { counts, edges };
  }

  addLesson({
    id: 'mpl', group: 'Python & data', title: 'Matplotlib & Seaborn: seeing the data', short: 'Matplotlib', tag: '(plots)',
    goal: 'Draw the six plots every analysis needs (line, scatter, histogram, bar, box, heatmap), understand the figure anatomy and arrange several plots in one picture.',
    concept: `
      <div class="two"><div><p><b>You will learn</b></p><ul>
        <li>Figure vs Axes: what <code>plt.subplots()</code> returns</li>
        <li>line, scatter, histogram, bar (with error bars), box plot</li>
        <li>colour by group, sizes, legends, annotations</li>
        <li>several plots in a grid, saving to a file</li>
        <li>seaborn heatmap of a correlation matrix</li></ul></div>
      <div><p><b>Key words</b></p><div class="chips"><span>Figure</span><span>Axes</span><span>bins</span><span>legend</span><span>alpha</span><span>cmap</span><span>subplots</span><span>Pearson r</span></div>
      <p style="margin-top:10px"><b>Rule of thumb</b> always plot the data before you model it: patterns and outliers jump out in a picture.</p></div></div>
      <div class="callout">Change the number of points, the histogram bins, or press the dice for new data. Each picture is drawn from the same numbers that appear in the code.</div>`,
    params: [
      { id: 'n', label: 'points', type: 'range', min: 20, max: 60, step: 1, value: 30 },
      { id: 'bins', label: 'histogram bins', type: 'range', min: 3, max: 15, step: 1, value: 7 },
      { id: 'seed', type: 'seed', value: 11, label: 'New data' },
    ],
    build(p) {
      const D = make(p), { x, g, y, wk, H, S, Sc, Mk, n } = D, B = p.bins;
      const yLo = Math.floor(Math.min(...y) / 10) * 10 - 5, yHi = Math.ceil(Math.max(...y) / 10) * 10 + 5;
      const mk = (o = {}) => Chart({ x: [0, 10], y: [yLo, yHi], xl: 'hours studied', yl: 'marks', ...o });

(function () {
  const arrI = a => `np.array([${a.join(', ')}])`;
  const area = (ch, f, a, b, n = 80) => { const pts = range(n + 1).map(i => { const x = a + (b - a) * i / n; return [ch.sx(x), ch.sy(f(x))]; }); return 'M' + r1(ch.sx(a)) + ' ' + r1(ch.sy(0)) + ' ' + pts.map(p => 'L' + r1(p[0]) + ' ' + r1(p[1])).join(' ') + ' L' + r1(ch.sx(b)) + ' ' + r1(ch.sy(0)) + ' Z'; };

  const binomPmf = (n, p, k) => comb(n, k) * Math.pow(p, k) * Math.pow(1 - p, n - k);
  const multimode = a => { const c = new Map(); a.forEach(v => c.set(v, (c.get(v) || 0) + 1)); const m = Math.max(...c.values()); return [...c.entries()].filter(e => e[1] === m).map(e => e[0]); };

(function () {

/* =====================================================================
   LESSON: Linear regression   (REFERENCE LESSON: copy its conventions)
   - data comes from a seeded RNG and is printed LITERALLY in the code cell,
     so every printed number in the terminal is really what Python would print
   - the notebook shows the same arithmetic by hand with the real numbers
   - every step has a viz(t) that animates with t = 0..1
   ===================================================================== */
(function () {
  const sb = n => String(n).replace(/\d/g, d => '₀₁₂₃₄₅₆₇₈₉'[d]);

  function data(p) {
    const r = RNG(p.seed), n = p.n;
    const x = range(n).map(() => round(1 + r() * 9, 1)).sort((a, b) => a - b);
    const sl = x.map(() => round(5 + r() * 4, 1));
    const y = x.map((v, i) => round(24 + 4.2 * v + 2.5 * sl[i] + r.norm(0, p.noise), 1));
    return { x, y, sl, n };
  }
  function fitLine(x, y) {
    const mx = mean(x), my = mean(y);
    const Sxy = sum(x.map((v, i) => (v - mx) * (y[i] - my))), Sxx = sum(x.map(v => (v - mx) ** 2));
    const w = Sxy / Sxx; return { mx, my, Sxy, Sxx, w, b: my - w * mx };
  }
  function simGD(x, y, lr, E) {
    let w = 0, b = 0; const n = x.length, H = { w: [], b: [], loss: [] }; let first = null;
    for (let e = 0; e <= E; e++) {
      let l = 0, dw = 0, db = 0;
      for (let i = 0; i < n; i++) { const er = w * x[i] + b - y[i]; l += er * er; dw += er * x[i]; db += er; }
      l /= n; dw *= 2 / n; db *= 2 / n;
      if (e === 0) first = { dw, db, w: -lr * dw, b: -lr * db, l };
      w -= lr * dw; b -= lr * db; H.w.push(w); H.b.push(b); H.loss.push(l);
    }
    return { H, first };
  }

  addLesson({
    id: 'linreg', group: 'Supervised learning', title: 'Linear regression', short: 'Linear regression', tag: '(predict a number)',
    goal: 'Fit the straight line ŷ = w·x + b that makes the squared mistakes as small as possible. Done by formula, by gradient descent and with scikit-learn.',
    concept: `
      <div class="two"><div><p><b>You will learn</b></p><ul>
        <li>what a residual, SSE and MSE are, and why we square</li>
        <li>least squares by hand: x̄, ȳ, S<sub>xy</sub>, S<sub>xx</sub></li>
        <li>gradient descent: how a computer finds w and b with no formula</li>
        <li><code>LinearRegression</code>, <code>coef_</code>, <code>intercept_</code>, <code>predict</code></li>
        <li>R², MAE, RMSE and the residual plot</li>
        <li>several features at once (multiple regression)</li></ul></div>
      <div><p><b>Key words</b></p><div class="chips"><span>feature</span><span>target</span><span>slope w</span><span>intercept b</span><span>residual</span><span>loss</span><span>learning rate</span><span>epoch</span><span>R²</span></div>
      <p style="margin-top:10px"><b>Use it when</b> the answer is a number (price, marks, temperature) and the relationship is roughly a straight line.</p></div></div>
      <div class="callout">Change <b>noise</b>, the number of points or press the dice to get new data. Every number in the notebook and in the terminal is recomputed.</div>`,
    params: [
      { id: 'n', label: 'points', type: 'range', min: 8, max: 30, step: 1, value: 12 },
      { id: 'noise', label: 'noise', type: 'range', min: 1, max: 10, step: 0.5, value: 4 },
      { id: 'gw', label: 'guess w', type: 'range', min: 0, max: 9, step: 0.1, value: 3, show: v => v.toFixed(1) },
      { id: 'gb', label: 'guess b', type: 'range', min: 0, max: 80, step: 1, value: 45 },
      { id: 'lrf', label: 'learning rate', type: 'range', min: 0.1, max: 0.9, step: 0.05, value: 0.5, show: v => v.toFixed(2) + '×max' },
      { id: 'epochs', label: 'epochs', type: 'range', min: 200, max: 4000, step: 100, value: 2500 },
      { id: 'xq', label: 'predict for hours', type: 'number', min: 0, max: 12, step: 0.5, value: 7 },

'use strict';
/* =====================================================================
   LESSON: Logistic regression  (classification by probability)
   Real maths behind every number: sigmoid, log-loss, gradient descent loop,
   and a Newton/IRLS solver (same optimum scikit-learn's lbfgs reaches).
   ===================================================================== */
(function () {
  const sig = z => 1 / (1 + Math.exp(-z));
  const sb = n => String(n).replace(/\d/g, d => '₀₁₂₃₄₅₆₇₈₉'[d]);
  const dotp = (a, b) => { let s = 0; for (let j = 0; j < a.length; j++) s += a[j] * b[j]; return s; };
  const logloss = (y, p) => { const e = 1e-15; return -mean(y.map((v, i) => { const q = clamp(p[i], e, 1 - e); return v * Math.log(q) + (1 - v) * Math.log(1 - q); })); };

  /* L2-penalised logistic regression like sklearn: min  C*sum(logloss_i) + 0.5*|w|^2  (bias not penalised).
     X rows must end with the bias column 1. Newton's method with step halving. */
  function fitLogit(X, y, C) {
    const n = X.length, d = X[0].length; let w = Array(d).fill(0);
    const obj = ww => { let l = 0; for (let i = 0; i < n; i++) { const z = dotp(ww, X[i]); l += C * (Math.max(z, 0) + Math.log1p(Math.exp(-Math.abs(z))) - y[i] * z); } for (let j = 0; j < d - 1; j++) l += 0.5 * ww[j] * ww[j]; return l; };
    for (let it = 0; it < 120; it++) {
      const g = Array(d).fill(0), H = range(d).map(() => Array(d).fill(0));
      for (let i = 0; i < n; i++) {
        const p = sig(dotp(w, X[i]));
        for (let j = 0; j < d; j++) { g[j] += C * (p - y[i]) * X[i][j]; for (let k = 0; k < d; k++) H[j][k] += C * p * (1 - p) * X[i][j] * X[i][k]; }
      }
      for (let j = 0; j < d - 1; j++) { g[j] += w[j]; H[j][j] += 1; }
      for (let j = 0; j < d; j++) H[j][j] += 1e-12;
      const dir = solve(H, g); let s = 1; const f0 = obj(w);
      while (s > 1e-9 && obj(w.map((v, j) => v - s * dir[j])) > f0 + 1e-10 * Math.abs(f0)) s /= 2;
      w = w.map((v, j) => v - s * dir[j]);
      if (Math.hypot(...dir) * s < 1e-11) break;
    }
    return w;
  }

  /* ---- data: 1 feature ---- */
  function isMonotone(y) { let up = true, dn = true; for (let i = 1; i < y.length; i++) { if (y[i] < y[i - 1]) up = false; if (y[i] > y[i - 1]) dn = false; } return up || dn; }

    return { X, y };

  addLesson({
    id: 'logreg', group: 'Supervised learning', title: 'Logistic regression', short: 'Logistic regression', tag: '(predict a category)',
    goal: 'Turn a straight-line score into a probability with the sigmoid, learn the weights by minimising log-loss, and read the decision boundary.',

      /* gradient descent */

(function () {
  const ITEMS = ['bread', 'butter', 'cola', 'eggs', 'jam', 'milk'];
  function make(p) {

    for (let k = 0; k < 12; k++) {
      const b = r() < .6, m = r() < .55, bas = [];
      if (b) bas.push('bread');
      if (r() < (b ? .75 : .12)) bas.push('butter');
      if (r() < (b ? .45 : .1)) bas.push('jam');
      if (m) bas.push('milk');
      if (r() < (m ? .6 : .2)) bas.push('eggs');
      if (r() < .3) bas.push('cola');
      if (!bas.length) bas.push(r.pick(ITEMS));
      T.push(r.shuffle(bas));
    }
    return T;
  }
  const subsets = a => { const out = []; for (let m = 1; m < (1 << a.length) - 1; m++) out.push(a.filter((_, i) => m & (1 << i))); return out; };
  function runApriori(T, minsup) {
    const n = T.length, sets = T.map(t => new Set(t)), cnt = s => sets.filter(t => s.every(x => t.has(x))).length;
    const keyOf = s => s.join('|'); let level = ITEMS.filter(i => cnt([i]) / n >= minsup).map(i => [i]);
    const levels = [], all = [], supMap = new Map();
    level.forEach(s => supMap.set(keyOf(s), cnt(s)));
    let k = 1;
    while (level.length) {
      levels.push({ k, frequent: level.length, raw: null, pruned: null });
      level.forEach(s => all.push({ items: s, count: cnt(s), sup: cnt(s) / n }));
      const prevKeys = new Set(level.map(keyOf)), raw = new Map();
      level.forEach(a => level.forEach(b => { const u = ITEMS.filter(x => a.includes(x) || b.includes(x)); if (u.length === k + 1) raw.set(keyOf(u), u); }));
      const kept = [...raw.values()].filter(c => subsets(c).filter(s => s.length === k).every(s => prevKeys.has(keyOf(s))));
      const next = kept.filter(c => cnt(c) / n >= minsup);
      next.forEach(s => supMap.set(keyOf(s), cnt(s)));
      levels[levels.length - 1].nextRaw = raw.size; levels[levels.length - 1].nextKept = kept.length; levels[levels.length - 1].nextFreq = next.length;

  addLesson({

    goal: 'Find items that are bought together. Count support, prune with the Apriori property, build if-then rules and judge them with confidence and lift.',
    concept: `
      <div class="two"><div><p><b>You will learn</b></p><ul>

'use strict';
/* =====================================================================
   BOOT: navigation, routing, theme, keyboard
   ===================================================================== */
const ORDER = ['py', 'numpy', 'pandas', 'mpl', 'eda', 'mlintro', 'stats', 'linalg', 'prep', 'metrics', 'overfit', 'linreg', 'logreg', 'tree', 'forest', 'knn', 'nb', 'svm', 'kmeans', 'hier', 'apriori', 'boost', 'pca', 'quiz', 'interview'];
const GROUP_ORDER = ['Python & data', 'ML foundations', 'Supervised learning', 'Unsupervised learning', 'Bonus', 'Practice'];
const App = {
  items: [], player: null, seen: new Set(),
  init() {
    addPage({ id: 'quiz', group: 'Practice', title: 'Final quiz', short: 'Final quiz', render: el => Quiz.page(el) });
    addPage({ id: 'interview', group: 'Practice', title: 'Interview corner', short: 'Interview Q&A', render: el => Interview.page(el) });
    const rank = it => { const i = ORDER.indexOf(it.id); return i < 0 ? 999 : i; };
    this.items = [...LESSONS, ...PAGES].sort((a, b) => rank(a) - rank(b));
    this.buildNav();
    const id = location.hash.slice(1);
    this.open(this.items.some(i => i.id === id) ? id : this.items[0].id, true);
    $('#theme').onclick = () => {
      const d = document.documentElement, dark = d.dataset.theme ? d.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      d.dataset.theme = dark ? 'light' : 'dark';
    };
    window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== this.cur && this.items.some(i => i.id === h)) this.open(h, true); });
    document.addEventListener('keydown', e => {
      if (!this.player || e.target !== document.body || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === 'ArrowRight') { $('.b-next', this.player.root).click(); e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { $('.b-prev', this.player.root).click(); e.preventDefault(); }
      else if (e.key === ' ') { $('.b-play', this.player.root).click(); e.preventDefault(); }
    });
  },
  buildNav() {
    const groups = GROUP_ORDER.filter(g => this.items.some(i => i.group === g)).concat(uniq(this.items.map(i => i.group)).filter(g => !GROUP_ORDER.includes(g)));
    $('#nav').innerHTML = groups.map(g => `<div class="ng"><b>${g}</b>${this.items.filter(i => i.group === g).map(i => `<button type="button" class="pill" data-id="${i.id}">${i.short || i.title}</button>`).join('')}</div>`).join('');
    $$('#nav .pill').forEach(b => (b.onclick = () => this.open(b.dataset.id)));
  },
  open(id, noScroll) {
    const it = this.items.find(i => i.id === id); if (!it) return;
    if (this.player) { this.player.destroy(); this.player = null; }
    this.cur = id; this.seen.add(id);
    const root = $('#lesson'); root.innerHTML = '';
    if (it.build) this.player = new Player(it, root); else it.render(root);
    $$('#nav .pill').forEach(b => { b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'); b.classList.toggle('seen', this.seen.has(b.dataset.id) && b.dataset.id !== id); });
    if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
    if (!noScroll) $('#nav').scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' });
  },
};
document.addEventListener('DOMContentLoaded', () => App.init());
if (document.readyState !== 'loading') App.init();
