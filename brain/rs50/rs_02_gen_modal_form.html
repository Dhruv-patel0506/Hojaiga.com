<!doctype html><meta charset='utf-8'><button id=open aria-label='Open dialog'>Open</button><div id=dlg role=dialog class=hidden aria-label=Dialog><select id=st aria-label='status'><option value=new>New</option><option value=approved>Approved</option></select><button id=save aria-label='Save'>Save</button></div><div id=toast></div><style>.hidden{display:none}</style><script>open.onclick=()=>dlg.classList.remove('hidden');save.onclick=()=>{toast.textContent='saved:'+st.value;dlg.classList.add('hidden')}</script>
