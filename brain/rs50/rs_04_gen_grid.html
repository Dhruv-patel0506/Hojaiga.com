<!doctype html><meta charset='utf-8'><button id=sort aria-label='Sort by name'>Sort</button><input id=f aria-label='Filter'><table id=t><tbody><tr class='row' data-name='alpha' data-status='new'><td>alpha</td><td>7</td></tr><tr class='row' data-name='beta' data-status='new'><td>beta</td><td>2</td></tr><tr class='row' data-name='gamma' data-status='new'><td>gamma</td><td>9</td></tr><tr class='row' data-name='delta' data-status='new'><td>delta</td><td>9</td></tr><tr class='row' data-name='epsilon' data-status='new'><td>epsilon</td><td>4</td></tr><tr class='row' data-name='zeta' data-status='new'><td>zeta</td><td>4</td></tr></tbody></table><script>sort.onclick=()=>{let rs=[...t.querySelectorAll('.row')];rs.sort((a,b)=>a.dataset.name.localeCompare(b.dataset.name));rs.forEach(x=>t.querySelector('tbody').appendChild(x))};f.oninput=()=>{[...t.querySelectorAll('.row')].forEach(x=>x.style.display=x.dataset.name.includes(f.value)?'':'none')};t.onclick=e=>{let tr=e.target.closest('.row');if(tr)tr.dataset.status='active'}</script>
