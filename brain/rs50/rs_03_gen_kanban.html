<!doctype html><meta charset='utf-8'><input id=card aria-label='new card'><button id=add aria-label='Add card'>Add</button><ul id=todo></ul><button id=move aria-label='Move to done'>Move</button><ul id=done></ul><script>add.onclick=()=>{if(card.value){let li=document.createElement('li');li.className='kcard';li.textContent=card.value;todo.appendChild(li)}};move.onclick=()=>{let c=todo.lastElementChild;if(c)done.appendChild(c)}</script>
