<!doctype html><meta charset='utf-8'><div id=wrap><div class='step hidden' id=st0><input id=s0 aria-label='field s0'></div><div class='step hidden' id=st1><input id=s1 aria-label='field s1'></div><div class='step hidden' id=st2><input id=s2 aria-label='field s2'></div></div><button id=next aria-label='Next'>Next</button><button id=submit aria-label='Submit' class=hidden>Submit</button><div id=done></div><style>.hidden{display:none}</style><script>let i=0;const ss=[...document.querySelectorAll('.step')];next.onclick=()=>{ss[i].classList.add('hidden');i++;if(i<ss.length)ss[i].classList.remove('hidden');if(i==ss.length){next.classList.add('hidden');submit.classList.remove('hidden')}};submit.onclick=()=>{done.textContent='submitted'}</script>
