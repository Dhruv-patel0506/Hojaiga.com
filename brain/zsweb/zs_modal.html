<!doctype html><meta charset='utf-8'><button id=openbtn aria-label='Open dialog'>Open</button><div id=dialog role=dialog class=hidden aria-label=Dialog><input id=note aria-label='note'><button id=ok aria-label='Confirm'>OK</button></div><div id=out></div><style>.hidden{display:none}</style><script>openbtn.onclick=()=>dialog.classList.remove('hidden');ok.onclick=()=>{out.textContent=note.value;dialog.classList.add('hidden')}</script>
