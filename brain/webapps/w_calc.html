<!doctype html><meta charset='utf-8'><div id=disp>0</div><button id='k_0'>0</button><button id='k_1'>1</button><button id='k_2'>2</button><button id='k_3'>3</button><button id='k_4'>4</button><button id='k_5'>5</button><button id='k_6'>6</button><button id='k_7'>7</button><button id='k_8'>8</button><button id='k_9'>9</button><button id=k_mul>*</button><button id=k_add>+</button><button id=k_sub>-</button><button id=k_eq>=</button><script>function calc(s){var t=s.split(/([+*-])/),r=parseFloat(t[0]);for(var i=1;i<t.length;i+=2){var o=t[i],n=parseFloat(t[i+1]);r=o=='*'?r*n:(o=='+'?r+n:r-n);}return String(r);}let e='';const M={k_mul:'*',k_add:'+',k_sub:'-',k_eq:'='};for(let i=0;i<10;i++){document.getElementById('k_'+i).onclick=()=>{e+=i;disp.textContent=e}}['k_mul','k_add','k_sub','k_eq'].forEach(id=>{document.getElementById(id).onclick=()=>{if(id=='k_eq'){disp.textContent=calc(e);e='';}else{e+=M[id];disp.textContent=e;}}})</script>
