<svg class="dark " xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1345.7 138" width="1345.7" height="138">
  <style>:root, .light {
    --_lm: ;
    --_dm: initial;
    --bg: #ffffff;
    --fg: #1f1f1f;
    --line: #545454;
    --accent: #1a73e8;
    --surface: #f8f9fa;
    --border: #747775;
  }

  .dark {
    --_lm: initial;
    --_dm: ;
    --bg: #1f1f1f;
    --fg: #e3e3e3;
    --line: #bfbfbf;
    --accent: #8ab4f8;
    --surface: #2d2e30;
    --border: #8e918f;
  }
  @import url('https://fonts.googleapis.com/css2?family=Google+Sans+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Google Sans Mono', sans-serif; }
  svg {
    --_text:          var(--primaryTextColor, var(--fg));
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--lineColor, var(--defaultLinkColor, var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)))));
    --_arrow:         var(--_line);
    --_node-fill:     var(--primaryColor, var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg))));
    --_node-stroke:   var(--primaryBorderColor, var(--nodeBorder, var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)))));
    --_group-fill:    var(--surface, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  var(--_node-stroke);
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }</style>
  <defs>
    <style>text { font-family: "Google Sans Mono", monospace; font-size: 13px; dominant-baseline: central; white-space: pre; }
.outer-box { fill: color-mix(in srgb, var(--fg) 6%, transparent); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.75px; }
.rect-pill { fill: var(--bg); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; }
.stadium-pill { fill: var(--bg); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; }
.hex-pill { fill: var(--bg); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; stroke-linejoin: round; stroke-linecap: round; }
.diamond-box { fill: color-mix(in srgb, var(--fg) 9%, transparent); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; stroke-linejoin: round; stroke-linecap: round; }
.header-text { font-size: 14px; font-weight: 600; fill: var(--_text); }
.label-text { font-size: 13px; font-weight: 500; fill: var(--_text); }
.annotation-text { font-size: 12px; font-weight: 500; fill: var(--_text); }
.arrow-line, .bus-line { stroke: var(--_line); stroke-width: 1.5px; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.divider-line { stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.0px; stroke-opacity: 0.75; }</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="var(--_arrow)"/>
    </marker>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="var(--_arrow)"/>
    </marker>
  </defs>
  <g class="shape inner">
    <rect x="15" y="15" width="149" height="20" rx="3" ry="3" class="rect-pill"/>
    <text x="89.5" y="25" class="label-text" text-anchor="middle" dominant-baseline="central">Tutorial Video 1</text>
  </g>
  <g class="shape inner">
    <rect x="822.5" y="37" width="191.5" height="20" rx="3" ry="3" class="rect-pill"/>
    <text x="918.25" y="47" class="label-text" text-anchor="middle" dominant-baseline="central">De-duplication Matrix</text>
  </g>
  <g class="shape inner">
    <rect x="15" y="59" width="149" height="20" rx="3" ry="3" class="rect-pill"/>
    <text x="89.5" y="69" class="label-text" text-anchor="middle" dominant-baseline="central">Tutorial Video 2</text>
  </g>
  <g class="shape inner">
    <rect x="15" y="103" width="149" height="20" rx="3" ry="3" class="rect-pill"/>
    <text x="89.5" y="113" class="label-text" text-anchor="middle" dominant-baseline="central">Tutorial Video 3</text>
  </g>
  <line x1="164" y1="25" x2="198" y2="25" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="395.5" y1="25" x2="419" y2="25" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="790.75" y1="47" x2="820.5" y2="47" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="1014" y1="47" x2="1039.5" y2="47" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="164" y1="69" x2="198" y2="69" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="395.5" y1="69" x2="419" y2="69" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="164" y1="113" x2="198" y2="113" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="395.5" y1="113" x2="419" y2="113" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="790.75" y1="47" x2="790.75" y2="91" class="bus-line"/>
  <text x="208.5" y="25" class="annotation-text" text-anchor="start" dominant-baseline="central">Frame Slicing &amp; Delta</text>
  <text x="429.5" y="25" class="annotation-text" text-anchor="start" dominant-baseline="central">Spatial State Mapping (App States A, B, C)</text>
  <text x="1050" y="47" class="annotation-text" text-anchor="start" dominant-baseline="central">Consolidated Master App Graph</text>
  <text x="208.5" y="69" class="annotation-text" text-anchor="start" dominant-baseline="central">Frame Slicing &amp; Delta</text>
  <text x="429.5" y="69" class="annotation-text" text-anchor="start" dominant-baseline="central">Spatial State Mapping (App States B, C, D)</text>
  <text x="829" y="69" class="annotation-text" text-anchor="start" dominant-baseline="central">(Kills identical state transitions,</text>
  <text x="1143.5" y="69" class="annotation-text" text-anchor="start" dominant-baseline="central">(Covers 100% of the App)</text>
  <text x="829" y="91" class="annotation-text" text-anchor="start" dominant-baseline="central">keeps unique/hidden edge cases)</text>
  <text x="208.5" y="113" class="annotation-text" text-anchor="start" dominant-baseline="central">Frame Slicing &amp; Delta</text>
  <text x="429.5" y="113" class="annotation-text" text-anchor="start" dominant-baseline="central">Spatial State Mapping (App States A, D, E)</text>
</svg>
