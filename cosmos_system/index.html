<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cosmos System — Interactive Neural Web</title>
  <style>
    :root {
      --bg: #07070c;
      --panel: rgba(16, 16, 26, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #7c4dff;
      --text: #d8d8e8;
      --muted: #787896;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    /* Top Bar */
    header {
      position: fixed; top: 0; left: 0; right: 0; height: 46px;
      background: rgba(10, 10, 18, 0.9);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 20px; gap: 14px; z-index: 10;
    }
    .logo { font-weight: bold; font-size: 16px; color: #c59bff; letter-spacing: 1px; margin-right: 12px; }
    .nav-btn {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      color: var(--muted); padding: 5px 12px; border-radius: 14px; font-size: 11px; cursor: pointer;
    }
    .nav-btn.active { background: rgba(124, 77, 255, 0.25); color: #fff; border-color: var(--accent); }

    /* Left & Right Sidebars */
    .sidebar-left, .sidebar-right {
      position: fixed; top: 60px; width: 230px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px; z-index: 10;
      backdrop-filter: blur(8px); font-size: 11px;
    }
    .sidebar-left { left: 14px; bottom: 14px; }
    .sidebar-right { right: 14px; max-height: calc(100vh - 80px); overflow-y: auto; }
    .sec-title { color: var(--muted); margin: 12px 0 6px; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
    .btn-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill {
      background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      color: var(--text); padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer;
    }
    .pill.active, .pill:hover { border-color: var(--accent); background: rgba(124,77,255,0.3); }
    .slider-row { display: flex; align-items: center; justify-content: space-between; margin: 6px 0; }
    .slider-row input { width: 105px; accent-color: var(--accent); }

    /* Live Node Visual Modal (Bottom-Center / Floating) */
    #live-inspector {
      position: fixed; bottom: 20px; left: 265px; width: 460px;
      background: rgba(12, 13, 24, 0.94); border: 1px solid var(--accent);
      border-radius: 10px; padding: 14px; z-index: 20;
      box-shadow: 0 0 30px rgba(124, 77, 255, 0.35);
      display: none; backdrop-filter: blur(12px);
    }
    .insp-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .insp-title { font-size: 13px; font-weight: bold; color: #fff; }
    .status-badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; background: rgba(0, 230, 118, 0.2); color: #00e676; }
    .live-stage {
      margin-top: 10px; height: 130px; border-radius: 6px;
      background: #050509; border: 1px solid rgba(255,255,255,0.08);
      position: relative; overflow: hidden; padding: 10px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .live-log { font-size: 10px; color: #9be7ff; line-height: 1.5; }
    .progress-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; width: 60%; background: linear-gradient(90deg, #7c4dff, #00e5ff); transition: width 0.3s; }
    canvas { display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }
  </style>
</head>
<body>

<header>
  <div class="logo">COSMOS // CORE</div>
  <button class="nav-btn">GRAPH-FORCE</button>
  <button class="nav-btn active">GRAPH-COSMOS</button>
  <button class="nav-btn" onclick="spawnNewNode()">+ SPAWN NODE (GROW & HEAL)</button>
  <button class="nav-btn" onclick="simulateFault()">⚡ INJECT FAULT (TEST SELF-HEAL)</button>
</header>

<aside class="sidebar-left">
  <div class="sec-title">CENTER CORE MODE</div>
  <div class="btn-grid">
    <button class="pill active" onclick="setCoreMode('star', this)">BRIGHT STAR</button>
    <button class="pill" onclick="setCoreMode('blackhole', this)">BLACK HOLE</button>
    <button class="pill" onclick="setCoreMode('whitehole', this)">WHITE HOLE</button>
  </div>

  <div class="sec-title">ZOOM TO CLUSTER</div>
  <div class="btn-grid" id="cluster-buttons"></div>

  <div class="sec-title">SYSTEM TELEMETRY</div>
  <div id="stats-box" style="line-height: 1.8; color: #a5a5c7; margin-top: 6px;">
    Nodes Active: <span id="st-nodes">0</span><br/>
    Self-Heal Index: <span id="st-heal" style="color:#00e676">99.4%</span><br/>
    Cross-Links: <span id="st-links">0</span>
  </div>
</aside>

<aside class="sidebar-right">
  <div class="sec-title">UTILITIES (U)</div>
  <div class="slider-row"><span>ORBIT SPEED</span><input type="range" id="sl-speed" min="0" max="3" step="0.1" value="0.8"></div>
  <div class="slider-row"><span>GLOW INTENSITY</span><input type="range" id="sl-glow" min="0.3" max="2.5" step="0.1" value="1.3"></div>
  <div class="slider-row"><span>CROSS-LINK OPACITY</span><input type="range" id="sl-links" min="0" max="1" step="0.05" value="0.25"></div>
  <div class="sec-title">DOMAINS</div>
  <div id="domain-legend" style="line-height:1.9;"></div>
</aside>

<div id="live-inspector">
  <div class="insp-header">
    <div>
      <span class="insp-title" id="insp-name">Node Name</span>
      <span style="color:var(--muted); font-size:10px; margin-left:6px;" id="insp-cluster">CLUSTER</span>
    </div>
    <span class="status-badge" id="insp-status">● LIVE EXECUTING</span>
  </div>
  <div class="live-stage" id="insp-stage">
    <div id="insp-visual" style="font-size:11px; color:#fff;"></div>
    <div class="live-log" id="insp-log"></div>
    <div class="progress-bar"><div class="progress-fill" id="insp-prog"></div></div>
  </div>
</div>

<canvas id="cosmos"></canvas>

<script>
const canvas = document.getElementById('cosmos');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;
window.addEventListener('resize', () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; });

// Camera (Pan & Zoom)
let cam = { x: 0, y: 0, zoom: 1, targetX: 0, targetY: 0, targetZoom: 1 };
let coreMode = 'star'; // 'star' | 'blackhole' | 'whitehole'
let selectedNode = null;

// Cluster Definitions
const clusters = [
  { id: 'automation', name: 'AUTOMATION CORE', color: '#ffea00', x: 0, y: 0, r: 52, isCore: true,
    tasks: ['Orchestrating Webhook Mesh', 'Global State Sync', 'Auto-Scaling Worker Pool', 'Self-Healing Router'] },
  { id: 'tutor', name: 'AI TUTOR', color: '#40c4ff', x: -340, y: 160, r: 36,
    tasks: ['Socratic Dialogue Gen', 'Math Step Verifier', 'Adaptive Quiz Builder', 'Voice Pronunciation Coach', 'Concept Knowledge Graph'] },
  { id: 'animation', name: 'ANIMATION STUDIO', color: '#e040fb', x: -290, y: -190, r: 36,
    tasks: ['Keyframe Physics Solver', 'SVG Morph Renderer', 'Lip-Sync Audio Mapper', 'Shader Particle Emitter', '60FPS Frame Interpolator'] },
  { id: 'ppt', name: 'PPT MAKER', color: '#ff9100', x: 310, y: -150, r: 36,
    tasks: ['Slide Layout Synthesizer', 'Chart Data Visualizer', 'Brand Theme Injector', 'Speaker Notes Generator', 'Export Deck Pipeline'] },
  { id: 'healing', name: 'IMMUNE MESH', color: '#00e676', x: 320, y: 190, r: 34,
    tasks: ['Dead-Node Rerouter', 'Prompt Drift Detector', 'Memory Leak Scrubber', 'Redundant Clone Spawner'] }
];

const nodes = [];
const crossLinks = [];

// Populate sub-nodes around each cluster
clusters.forEach((c, cIdx) => {
  const count = c.isCore ? 16 : 22;
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
    const dist = c.r + 35 + Math.random() * 95;
    nodes.push({
      id: `${c.id}-${i}`,
      name: `${c.tasks[i % c.tasks.length]} #${i+1}`,
      cluster: c,
      angle,
      dist,
      speed: (0.002 + Math.random() * 0.004) * (i % 2 === 0 ? 1 : -1),
      size: 3 + Math.random() * 4.5,
      health: 1.0, // 1.0 = healthy, <0.5 = healing
      x: 0, y: 0
    });
  }
});

// Build inter-galaxy cross-links
function rebuildCrossLinks() {
  crossLinks.length = 0;
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      if (nodes[i].cluster !== nodes[j].cluster && Math.random() < 0.035) {
        crossLinks.push([nodes[i], nodes[j]]);
      }
    }
  }
  document.getElementById('st-nodes').innerText = nodes.length;
  document.getElementById('st-links').innerText = crossLinks.length;
}
rebuildCrossLinks();

// Populate UI Controls
const btnContainer = document.getElementById('cluster-buttons');
const legendContainer = document.getElementById('domain-legend');
const resetBtn = document.createElement('button');
resetBtn.className = 'pill'; resetBtn.innerText = 'ALL COSMOS';
resetBtn.onclick = () => focusCluster(null);
btnContainer.appendChild(resetBtn);

clusters.forEach(c => {
  const b = document.createElement('button');
  b.className = 'pill'; b.innerText = c.name.split(' ')[0];
  b.onclick = () => focusCluster(c);
  btnContainer.appendChild(b);

  legendContainer.innerHTML += `<div><span style="color:${c.color}">●</span> ${c.name}</div>`;
});

function focusCluster(c) {
  if (!c) { cam.targetX = 0; cam.targetY = 0; cam.targetZoom = 1; }
  else { cam.targetX = -c.x; cam.targetY = -c.y; cam.targetZoom = 2.1; }
}

function setCoreMode(mode, el) {
  coreMode = mode;
  document.querySelectorAll('.sidebar-left .pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
}

// Spawn a new node (demonstrating "More it grows, more it self-heals")
function spawnNewNode() {
  const c = clusters[Math.floor(Math.random() * clusters.length)];
  const n = {
    id: `${c.id}-${nodes.length}`,
    name: `${c.tasks[Math.floor(Math.random()*c.tasks.length)]} #${nodes.length}`,
    cluster: c,
    angle: Math.random() * Math.PI * 2,
    dist: c.r + 40 + Math.random() * 90,
    speed: 0.003,
    size: 5,
    health: 1.0,
    x: 0, y: 0
  };
  nodes.push(n);
  for (let i = 0; i < 5; i++) {
    const other = nodes[Math.floor(Math.random() * nodes.length)];
    if (other !== n) crossLinks.push([n, other]);
  }
  document.getElementById('st-nodes').innerText = nodes.length;
  document.getElementById('st-links').innerText = crossLinks.length;
  const resilience = Math.min(99.99, (99.0 + nodes.length * 0.008)).toFixed(2);
  document.getElementById('st-heal').innerText = `${resilience}%`;
}

// Inject fault & watch neighbors self-heal it
function simulateFault() {
  const victim = nodes[Math.floor(Math.random() * nodes.length)];
  victim.health = 0.05;
  selectedNode = victim;
  updateInspector(victim);
}

// Mouse Pan, Zoom & Click
let isDragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('mousedown', e => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('mouseup', () => isDragging = false);
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  cam.targetX += (e.clientX - lastX) / cam.zoom;
  cam.targetY += (e.clientY - lastY) / cam.zoom;
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  cam.targetZoom = Math.max(0.4, Math.min(4.0, cam.targetZoom * (e.deltaY < 0 ? 1.12 : 0.89)));
}, { passive: false });

canvas.addEventListener('click', e => {
  const mx = (e.clientX - W / 2) / cam.zoom - cam.x;
  const my = (e.clientY - H / 2) / cam.zoom - cam.y;
  for (let n of nodes) {
    if (Math.hypot(n.x - mx, n.y - my) < n.size + 8) {
      selectedNode = n;
      cam.targetX = -n.x; cam.targetY = -n.y; cam.targetZoom = 2.6;
      updateInspector(n);
      requestNodeStream(n); // Request live stream from backend
      return;
    }
  }
});

// Live Visual Inspector Logic
function updateInspector(n) {
  const box = document.getElementById('live-inspector');
  box.style.display = 'block';
  document.getElementById('insp-name').innerText = n.name;
  document.getElementById('insp-cluster').innerText = `[${n.cluster.name}]`;
}

setInterval(() => {
  if (!selectedNode) return;
  const n = selectedNode;
  const vis = document.getElementById('insp-visual');
  const log = document.getElementById('insp-log');
  const prog = document.getElementById('insp-prog');
  const badge = document.getElementById('insp-status');

  if (n.health < 0.95) {
    badge.innerText = '⚡ SELF-HEALING REROUTE IN PROGRESS';
    badge.style.color = '#ff5252';
    vis.innerHTML = `Neighbor nodes injecting state backup... Restoring (${Math.round(n.health*100)}%)`;
  } else {
    badge.innerText = '● LIVE STREAMING';
    badge.style.color = '#00e676';
    if (n.cluster.id === 'tutor') vis.innerHTML = `🎓 <b>Live Lesson Canvas:</b> Solving $\\int_0^\\pi \\sin(x)dx = 2$ with student_492...`;
    else if (n.cluster.id === 'animation') vis.innerHTML = `🎬 <b>Viewport Render:</b> Frame ${Math.floor( performance.now()/16 ) % 240}/240 | Bone Rig IK Active`;
    else if (n.cluster.id === 'ppt') vis.innerHTML = `📊 <b>Slide Synthesizer:</b> Building Slide #${(Math.floor(Date.now()/900)%12)+1} (3D Bar Chart + Executive Summary)`;
    else vis.innerHTML = `⚙️ <b>Core Pipeline:</b> Routing 1,420 events/sec across ${crossLinks.length} neural pathways`;
  }
  log.innerHTML = `Latency: ${(1.2 + Math.random()*1.5).toFixed(1)}ms | Mesh Redundancy: ${nodes.length} peers | Checksum: OK`;
  prog.style.width = `${25 + (Date.now() / 30) % 75}%`;
}, 250);

// Connect to WebSocket backend
const ws = new WebSocket("ws://localhost:8000/ws/cosmos");

ws.onopen = () => {
  console.log("Connected to Cosmos Backend WebSocket Engine.");
};

ws.onmessage = (event) => {
  const packet = JSON.parse(event.data);
  
  if (packet.type === "node_stream" && selectedNode) {
    document.getElementById("insp-status").innerText = `● ${packet.telemetry.status}`;
    document.getElementById("insp-visual").innerHTML = `⚡ <b>Worker Status:</b> ${packet.telemetry.task}`;
  } else if (packet.type === "heartbeat") {
    document.getElementById("st-nodes").innerText = packet.activeNodes;
    document.getElementById("st-heal").innerText = `${packet.resilience}%`;
  } else if (packet.type === "heal_success" || packet.type === "fault_alert") {
    document.getElementById("insp-log").innerText = `[${new Date().toLocaleTimeString()}] ${packet.message}`;
  }
};

// When clicking a node on canvas, request live stream from backend
function requestNodeStream(node) {
  if (ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({
      action: "inspect_node",
      nodeId: node.id,
      clusterType: node.cluster.id
    }));
  }
}

// Inject fault via WebSocket
function simulateFault() {
  const victim = nodes[Math.floor(Math.random() * nodes.length)];
  victim.health = 0.05;
  selectedNode = victim;
  updateInspector(victim);
  
  if (ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({
      action: "inject_fault",
      clusterType: victim.cluster.id
    }));
  }
}

// Main Render Loop
function animate() {
  requestAnimationFrame(animate);
  const orbitMult = parseFloat(document.getElementById('sl-speed').value);
  const glowMult = parseFloat(document.getElementById('sl-glow').value);
  const linkAlpha = parseFloat(document.getElementById('sl-links').value);

  cam.x += (cam.targetX - cam.x) * 0.1;
  cam.y += (cam.targetY - cam.y) * 0.1;
  cam.zoom += (cam.targetZoom - cam.zoom) * 0.1;

  ctx.fillStyle = '#07070c';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(cam.x, cam.y);

  // Update node positions & self-healing
  nodes.forEach(n => {
    n.angle += n.speed * orbitMult;
    n.x = n.cluster.x + Math.cos(n.angle) * n.dist;
    n.y = n.cluster.y + Math.sin(n.angle) * n.dist;
    if (n.health < 1.0) n.health = Math.min(1.0, n.health + 0.006);
  });

  // 1. Draw Inter-Galaxy Cross-Links
  ctx.lineWidth = 0.7;
  crossLinks.forEach(([a, b]) => {
    ctx.strokeStyle = `rgba(140, 120, 255, ${linkAlpha})`;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  });

  // 2. Draw Cluster Cores & Radial Links
  clusters.forEach(c => {
    const grad = ctx.createRadialGradient(c.x, c.y, 2, c.x, c.y, c.r * 2.4 * glowMult);
    if (c.isCore && coreMode === 'blackhole') {
      grad.addColorStop(0, '#000000');
      grad.addColorStop(0.35, '#000000');
      grad.addColorStop(0.45, '#ff9100');
      grad.addColorStop(0.7, 'rgba(124, 77, 255, 0.35)');
      grad.addColorStop(1, 'transparent');
    } else if (c.isCore && coreMode === 'whitehole') {
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.5, '#80d8ff');
      grad.addColorStop(1, 'transparent');
    } else {
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.25, c.color);
      grad.addColorStop(1, 'transparent');
    }
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r * 2.4 * glowMult, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(c.name, c.x, c.y - c.r - 10);
  });

  // 3. Draw Orbiting Nodes & Parent-Child Links
  nodes.forEach(n => {
    ctx.strokeStyle = n.health < 0.9 ? '#ff5252' : `${n.cluster.color}44`;
    ctx.lineWidth = n.health < 0.9 ? 2 : 0.9;
    ctx.beginPath(); ctx.moveTo(n.cluster.x, n.cluster.y); ctx.lineTo(n.x, n.y); ctx.stroke();

    const nColor = n.health < 0.9 ? '#ff1744' : n.cluster.color;
    ctx.shadowBlur = 12 * glowMult;
    ctx.shadowColor = nColor;
    ctx.fillStyle = nColor;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.size, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    if (selectedNode === n) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.size + 6, 0, Math.PI * 2); ctx.stroke();
    }
  });

  ctx.restore();
}
animate();
</script>
</body>
</html>
