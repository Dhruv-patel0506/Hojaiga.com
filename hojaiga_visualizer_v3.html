<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hojaiga OS  True Runtime Visualizer (v3)</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --grid-color: #2c2c2c;
            --text-color: #e0e0e0;
            --node-bg: #2d2d2d;
            --node-border: #444;
            --node-title-bg: #3c3c3c;
            
            --state-ready: #ffc107;
            --state-running: #007bff;
            --state-success: #28a745;
            --state-error: #dc3545;
            
            --conn-color: #555;
            --panel-bg: rgba(30, 30, 30, 0.95);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            height: 100vh;
        }
        
        #left-panel {
            width: 350px;
            background: var(--panel-bg);
            border-right: 1px solid var(--node-border);
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        #canvas-container {
            flex-grow: 1;
            position: relative;
            overflow: auto;
        }
        
        .panel-section {
            padding: 15px;
            border-bottom: 1px solid var(--node-border);
        }
        
        .panel-section h3 { margin: 0 0 10px 0; font-size: 14px; color: #888; text-transform: uppercase; }
        
        #event-stream {
            flex-grow: 1;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            padding: 10px;
            background: #111;
        }
        
        .log-entry { margin-bottom: 8px; border-left: 3px solid #555; padding-left: 8px; }
        .log-entry.success { border-color: var(--state-success); }
        .log-entry.error { border-color: var(--state-error); }
        .log-entry.running { border-color: var(--state-running); }
        
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stat-box {
            background: var(--node-bg);
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        .stat-value { font-size: 24px; font-weight: bold; }
        .stat-label { font-size: 11px; color: #888; }
        
        #svg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        #nodes-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
        }
        
        .node {
            position: absolute;
            width: 260px;
            background: var(--node-bg);
            border: 2px solid var(--node-border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: border-color 0.3s;
        }
        .node.running { border-color: var(--state-running); box-shadow: 0 0 10px var(--state-running); }
        .node.error { border-color: var(--state-error); box-shadow: 0 0 10px var(--state-error); }
        .node.success { border-color: var(--state-success); }
        
        .node-header {
            background: var(--node-title-bg);
            padding: 10px;
            border-radius: 6px 6px 0 0;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 1px solid var(--node-border);
        }
        .node-body {
            padding: 10px;
            font-size: 12px;
            color: #ccc;
        }
        
        #connection-status {
            padding: 10px;
            text-align: center;
            font-weight: bold;
            background: var(--state-error);
        }
        #connection-status.connected {
            background: var(--state-success);
        }
    </style>
</head>
<body>
    <div id="left-panel">
        <div id="connection-status">DISCONNECTED</div>
        <div class="panel-section">
            <h3>Runtime Health</h3>
            <div class="stat-grid">
                <div class="stat-box"><div class="stat-value" id="stat-tasks">0</div><div class="stat-label">Active Tasks</div></div>
                <div class="stat-box"><div class="stat-value" id="stat-events">0</div><div class="stat-label">Total Events</div></div>
                <div class="stat-box"><div class="stat-value" id="stat-errors">0</div><div class="stat-label">Errors</div></div>
                <div class="stat-box"><div class="stat-value" id="stat-recoveries">0</div><div class="stat-label">Recoveries</div></div>
            </div>
        </div>
        <div class="panel-section">
            <h3>Task Details</h3>
            <div id="task-details" style="font-size: 12px; color: #ccc;">Waiting for task...</div>
        </div>
        <div class="panel-section" style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; padding: 0;">
            <h3 style="padding: 15px 15px 0 15px;">Event Stream (Live)</h3>
            <div id="event-stream"></div>
        </div>
    </div>
    
    <div id="canvas-container">
        <svg id="svg-layer"></svg>
        <div id="nodes-layer"></div>
    </div>

    <script>
        const ws = new WebSocket('ws://127.0.0.1:8765');
        const eventStream = document.getElementById('event-stream');
        const nodesLayer = document.getElementById('nodes-layer');
        const svgLayer = document.getElementById('svg-layer');
        const connectionStatus = document.getElementById('connection-status');
        
        let stats = { tasks: 0, events: 0, errors: 0, recoveries: 0 };
        let nodeElements = {};
        let lastNodeId = null;
        
        const EXPECTED_FLOW = [
            "TASK_CREATED", "INTENT_NORMALIZATION_STARTED", "INTENT_NORMALIZATION_COMPLETED",
            "COMPILATION_STARTED", "COMPILATION_COMPLETED", "AGENTS_STARTED", "AGENT_ASSIGNED",
            "SCAN_STARTED", "SCAN_COMPLETED", "POPUP_RESOLVED", "CONTROLLER_EXECUTING",
            "AGENTS_COMPLETED", "VERIFICATION_STARTED", "VERIFICATION_COMPLETED", "TASK_COMPLETED"
        ];
        
        function updateStats() {
            document.getElementById('stat-tasks').innerText = stats.tasks;
            document.getElementById('stat-events').innerText = stats.events;
            document.getElementById('stat-errors').innerText = stats.errors;
            document.getElementById('stat-recoveries').innerText = stats.recoveries;
        }

        ws.onopen = () => {
            connectionStatus.innerText = "CONNECTED";
            connectionStatus.className = "connected";
        };

        ws.onclose = () => {
            connectionStatus.innerText = "DISCONNECTED";
            connectionStatus.className = "";
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            stats.events++;
            
            // Log to event stream
            let statusClass = "running";
            if (data.topic.includes("FAILED") || data.topic.includes("ERROR")) {
                statusClass = "error";
                stats.errors++;
            } else if (data.topic.includes("COMPLETED") || data.topic.includes("RESOLVED")) {
                statusClass = "success";
            } else if (data.topic.includes("REPLANNING") || data.topic.includes("RECOVERY")) {
                stats.recoveries++;
            }
            
            if (data.topic === "TASK_CREATED") stats.tasks++;
            updateStats();
            
            const logEntry = document.createElement("div");
            logEntry.className = `log-entry ${statusClass}`;
            logEntry.innerHTML = `<span style="color:#888">[${new Date().toLocaleTimeString()}]</span><br>
                                  <strong style="color:white">${data.topic}</strong><br>
                                  Source: ${data.source}<br>
                                  Task: ${data.data.task_id || "N/A"}`;
            eventStream.prepend(logEntry);
            
            if (data.data.task_id) {
                document.getElementById('task-details').innerHTML = `
                    <strong>ID:</strong> ${data.data.task_id}<br>
                    <strong>Last State:</strong> ${data.topic}<br>
                    <strong>Source:</strong> ${data.source}
                `;
            }
            
            // Update DAG visualization
            if (EXPECTED_FLOW.includes(data.topic) || data.topic.includes("FAILED")) {
                renderNode(data);
            }
        };
        
        let yOffset = 50;
        
        function renderNode(data) {
            let nodeId = data.topic;
            if (!nodeElements[nodeId]) {
                const node = document.createElement('div');
                node.className = `node ${data.topic.includes("FAILED") ? "error" : "success"}`;
                node.style.left = `50px`;
                node.style.top = `${yOffset}px`;
                yOffset += 120;
                
                node.innerHTML = `
                    <div class="node-header">${data.topic}</div>
                    <div class="node-body">
                        <div>Source: ${data.source}</div>
                        <div>Time: ${new Date().toLocaleTimeString()}</div>
                    </div>
                `;
                nodesLayer.appendChild(node);
                nodeElements[nodeId] = node;
                
                if (lastNodeId) {
                    drawConnection(lastNodeId, nodeId);
                }
                lastNodeId = nodeId;
            } else {
                // Update existing node
                nodeElements[nodeId].className = `node ${data.topic.includes("FAILED") ? "error" : "success"}`;
            }
        }
        
        function drawConnection(fromId, toId) {
            const fromNode = nodeElements[fromId];
            const toNode = nodeElements[toId];
            
            const x1 = parseInt(fromNode.style.left) + 130;
            const y1 = parseInt(fromNode.style.top) + fromNode.offsetHeight;
            const x2 = parseInt(toNode.style.left) + 130;
            const y2 = parseInt(toNode.style.top);
            
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1);
            line.setAttribute('y1', y1);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', y2);
            line.setAttribute('stroke', '#555');
            line.setAttribute('stroke-width', '2');
            svgLayer.appendChild(line);
        }
    </script>
</body>
</html>
